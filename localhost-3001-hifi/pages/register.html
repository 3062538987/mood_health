<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>创建新账号 · 情绪健康管理平台</title>
    <link rel="stylesheet" href="../colors_and_type.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/4.0"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        @keyframes drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(8px, -12px) scale(1.03); }
            66% { transform: translate(-6px, 6px) scale(0.98); }
        }
        @keyframes breathe {
            0%, 100% { opacity: 0.45; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.06); }
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(232, 131, 74, 0.3); }
            50% { box-shadow: 0 0 0 8px rgba(232, 131, 74, 0); }
        }
        @keyframes checkmark {
            0% { stroke-dashoffset: 24; }
            100% { stroke-dashoffset: 0; }
        }

        .rise { animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.08s; }
        .delay-2 { animation-delay: 0.16s; }
        .delay-3 { animation-delay: 0.24s; }
        .delay-4 { animation-delay: 0.32s; }
        .delay-5 { animation-delay: 0.40s; }
        .delay-6 { animation-delay: 0.48s; }
        .delay-7 { animation-delay: 0.56s; }
        .delay-8 { animation-delay: 0.64s; }
        .delay-9 { animation-delay: 0.72s; }

        body {
            background-color: var(--mh-background);
            color: var(--mh-text);
            font-family: var(--mh-font-body);
        }

        .aurora {
            background:
                radial-gradient(ellipse 120% 80% at 20% -10%, rgba(240, 184, 96, 0.32) 0%, transparent 50%),
                radial-gradient(ellipse 100% 90% at 90% 10%, rgba(232, 131, 74, 0.18) 0%, transparent 45%),
                radial-gradient(ellipse 80% 70% at 70% 95%, rgba(138, 171, 124, 0.16) 0%, transparent 45%),
                linear-gradient(180deg, #fff9f4 0%, #fef3ea 50%, #fdf6ef 100%);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            pointer-events: none;
        }

        .glass-input {
            background: rgba(255, 253, 249, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(232, 221, 208, 0.7);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-input:focus-within {
            background: rgba(255, 253, 249, 0.92);
            border-color: var(--mh-primary);
            box-shadow: 0 0 0 4px rgba(232, 131, 74, 0.12), 0 4px 16px rgba(232, 131, 74, 0.08);
        }
        .glass-input input::placeholder {
            color: var(--mh-text-muted);
        }
        .glass-input input:focus {
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f0b860 0%, #e8834a 100%);
            color: white;
            box-shadow: 0 8px 24px rgba(232, 131, 74, 0.28);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(232, 131, 74, 0.36);
        }
        .btn-primary:active:not(:disabled) {
            transform: scale(0.97);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .step-active {
            background: linear-gradient(135deg, #f0b860 0%, #e8834a 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(232, 131, 74, 0.3);
            animation: pulse-glow 2.5s ease-in-out infinite;
        }
        .step-done {
            background: var(--mh-secondary);
            color: white;
        }
        .step-pending {
            background: rgba(255, 253, 249, 0.7);
            border: 1.5px solid var(--mh-border);
            color: var(--mh-text-muted);
        }

        .step-line-active {
            background: linear-gradient(90deg, var(--mh-primary), var(--mh-accent));
        }
        .step-line-pending {
            background: var(--mh-border);
        }

        .strength-bar {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .checkbox-custom {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border: 1.5px solid var(--mh-border);
            border-radius: 6px;
            background: rgba(255, 253, 249, 0.8);
            cursor: pointer;
            position: relative;
            transition: all 0.25s ease;
            flex-shrink: 0;
        }
        .checkbox-custom:checked {
            background: linear-gradient(135deg, #f0b860 0%, #e8834a 100%);
            border-color: var(--mh-primary);
        }
        .checkbox-custom:checked::after {
            content: '';
            position: absolute;
            left: 6px;
            top: 2px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            animation: checkmark 0.3s ease-out forwards;
        }

        .link-text {
            color: var(--mh-primary);
            font-weight: 600;
            position: relative;
        }
        .link-text::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--mh-primary);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.3s ease;
        }
        .link-text:hover::after {
            transform: scaleX(1);
            transform-origin: left;
        }

        .code-btn {
            background: linear-gradient(135deg, rgba(240, 184, 96, 0.15) 0%, rgba(232, 131, 74, 0.15) 100%);
            color: var(--mh-primary);
            border: 1px solid rgba(232, 131, 74, 0.25);
            transition: all 0.25s ease;
            white-space: nowrap;
        }
        .code-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(240, 184, 96, 0.25) 0%, rgba(232, 131, 74, 0.25) 100%);
        }
        .code-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .back-btn {
            transition: all 0.25s ease;
        }
        .back-btn:hover {
            transform: translateX(-2px);
        }
        .back-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="antialiased min-h-screen">

    <div class="aurora min-h-screen w-full max-w-[480px] mx-auto relative overflow-hidden">

        <!-- Organic Background Orbs -->
        <div class="orb w-72 h-72 bg-[var(--mh-accent)]/25 -top-24 -left-24" style="animation: drift 12s ease-in-out infinite;"></div>
        <div class="orb w-64 h-64 bg-[var(--mh-primary)]/18 top-1/3 -right-20" style="animation: drift 15s ease-in-out infinite 1s;"></div>
        <div class="orb w-56 h-56 bg-[var(--mh-secondary)]/14 bottom-20 -left-16" style="animation: drift 14s ease-in-out infinite 2s;"></div>
        <div class="orb w-80 h-80 bg-[var(--mh-accent)]/10 -bottom-32 right-1/4" style="animation: breathe 8s ease-in-out infinite;"></div>

        <!-- Status Bar -->
        <div class="rise flex items-center justify-between px-6 pt-4 pb-2 text-[13px] font-semibold text-[var(--mh-text)] relative z-10">
            <span id="clock">9:41</span>
            <div class="flex items-center gap-1.5">
                <i data-lucide="signal" class="w-4 h-4"></i>
                <i data-lucide="wifi" class="w-4 h-4"></i>
                <i data-lucide="battery-full" class="w-5 h-5"></i>
            </div>
        </div>

        <!-- Top Navigation with Back Button -->
        <div class="rise delay-1 relative z-10 px-5 py-3 flex items-center">
            <button class="back-btn w-10 h-10 rounded-full bg-white/70 backdrop-blur-sm border border-[var(--mh-border)] flex items-center justify-center text-[var(--mh-text)]">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Page Title -->
        <header class="rise delay-2 relative z-10 px-6 pt-4 pb-8">
            <h1 class="text-[32px] leading-[1.2] font-bold text-[var(--mh-text)] mb-3" style="font-family: var(--mh-font-display);">
                创建新账号
            </h1>
            <p class="text-[14px] text-[var(--mh-text-light)] leading-relaxed">
                加入我们，开始你的情绪健康之旅
            </p>
        </header>

        <!-- Step Indicator -->
        <section class="rise delay-3 relative z-10 px-6 pb-8">
            <div class="flex items-center justify-between">
                <!-- Step 1 -->
                <div class="flex flex-col items-center gap-2">
                    <div class="step-active w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold">
                        1
                    </div>
                    <span class="text-[11px] font-semibold text-[var(--mh-primary)]">基本信息</span>
                </div>
                <!-- Line 1 -->
                <div class="flex-1 h-0.5 mx-2 step-line-pending rounded-full relative overflow-hidden">
                    <div class="absolute inset-y-0 left-0 w-0 step-line-active rounded-full transition-all duration-500 ease-out" id="line1"></div>
                </div>
                <!-- Step 2 -->
                <div class="flex flex-col items-center gap-2">
                    <div class="step-pending w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold">
                        2
                    </div>
                    <span class="text-[11px] font-medium text-[var(--mh-text-muted)]">完善资料</span>
                </div>
                <!-- Line 2 -->
                <div class="flex-1 h-0.5 mx-2 step-line-pending rounded-full"></div>
                <!-- Step 3 -->
                <div class="flex flex-col items-center gap-2">
                    <div class="step-pending w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold">
                        3
                    </div>
                    <span class="text-[11px] font-medium text-[var(--mh-text-muted)]">完成</span>
                </div>
            </div>
        </section>

        <!-- Form Area -->
        <section class="relative z-10 px-6 pb-6">
            <form id="registerForm" autocomplete="off">
                <!-- Username -->
                <div class="rise delay-4 mb-4">
                    <label class="block text-[13px] font-semibold text-[var(--mh-text)] mb-2.5">用户名</label>
                    <div class="glass-input h-14 rounded-[16px] flex items-center px-4 gap-3">
                        <i data-lucide="user" class="w-5 h-5 text-[var(--mh-text-muted)] flex-shrink-0"></i>
                        <input 
                            type="text" 
                            id="username"
                            placeholder="请输入用户名" 
                            class="flex-1 bg-transparent text-[15px] text-[var(--mh-text)] placeholder:text-[var(--mh-text-muted)]"
                        >
                    </div>
                </div>

                <!-- Phone -->
                <div class="rise delay-5 mb-4">
                    <label class="block text-[13px] font-semibold text-[var(--mh-text)] mb-2.5">手机号</label>
                    <div class="glass-input h-14 rounded-[16px] flex items-center px-4 gap-3">
                        <i data-lucide="smartphone" class="w-5 h-5 text-[var(--mh-text-muted)] flex-shrink-0"></i>
                        <input 
                            type="tel" 
                            id="phone"
                            placeholder="请输入手机号" 
                            maxlength="11"
                            class="flex-1 bg-transparent text-[15px] text-[var(--mh-text)] placeholder:text-[var(--mh-text-muted)]"
                        >
                    </div>
                </div>

                <!-- Verification Code -->
                <div class="rise delay-6 mb-4">
                    <label class="block text-[13px] font-semibold text-[var(--mh-text)] mb-2.5">验证码</label>
                    <div class="glass-input h-14 rounded-[16px] flex items-center px-4 gap-3">
                        <i data-lucide="message-square" class="w-5 h-5 text-[var(--mh-text-muted)] flex-shrink-0"></i>
                        <input 
                            type="text" 
                            id="code"
                            placeholder="请输入验证码" 
                            maxlength="6"
                            class="flex-1 bg-transparent text-[15px] text-[var(--mh-text)] placeholder:text-[var(--mh-text-muted)]"
                        >
                        <button 
                            type="button" 
                            id="codeBtn"
                            class="code-btn h-9 px-4 rounded-[10px] text-[13px] font-semibold"
                        >
                            获取验证码
                        </button>
                    </div>
                </div>

                <!-- Password -->
                <div class="rise delay-7 mb-4">
                    <label class="block text-[13px] font-semibold text-[var(--mh-text)] mb-2.5">设置密码</label>
                    <div class="glass-input h-14 rounded-[16px] flex items-center px-4 gap-3">
                        <i data-lucide="lock" class="w-5 h-5 text-[var(--mh-text-muted)] flex-shrink-0"></i>
                        <input 
                            type="password" 
                            id="password"
                            placeholder="请设置 6-20 位密码" 
                            maxlength="20"
                            class="flex-1 bg-transparent text-[15px] text-[var(--mh-text)] placeholder:text-[var(--mh-text-muted)]"
                        >
                        <button type="button" id="togglePwd" class="text-[var(--mh-text-muted)] hover:text-[var(--mh-primary)] transition-colors p-1">
                            <i data-lucide="eye" class="w-5 h-5" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Password Strength -->
                <div class="rise delay-7 mb-4">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex gap-1.5 flex-1">
                            <div id="strBar1" class="strength-bar h-1 flex-1 rounded-full bg-[var(--mh-border)]"></div>
                            <div id="strBar2" class="strength-bar h-1 flex-1 rounded-full bg-[var(--mh-border)]"></div>
                            <div id="strBar3" class="strength-bar h-1 flex-1 rounded-full bg-[var(--mh-border)]"></div>
                        </div>
                        <span id="strText" class="text-[11px] font-medium text-[var(--mh-text-muted)] ml-3 w-10 text-right">弱</span>
                    </div>
                    <p class="text-[11px] text-[var(--mh-text-muted)]">密码需包含字母和数字，长度 6-20 位</p>
                </div>

                <!-- Confirm Password -->
                <div class="rise delay-8 mb-5">
                    <label class="block text-[13px] font-semibold text-[var(--mh-text)] mb-2.5">确认密码</label>
                    <div class="glass-input h-14 rounded-[16px] flex items-center px-4 gap-3">
                        <i data-lucide="shield-check" class="w-5 h-5 text-[var(--mh-text-muted)] flex-shrink-0"></i>
                        <input 
                            type="password" 
                            id="confirmPassword"
                            placeholder="请再次输入密码" 
                            maxlength="20"
                            class="flex-1 bg-transparent text-[15px] text-[var(--mh-text)] placeholder:text-[var(--mh-text-muted)]"
                        >
                        <button type="button" id="toggleConfirmPwd" class="text-[var(--mh-text-muted)] hover:text-[var(--mh-primary)] transition-colors p-1">
                            <i data-lucide="eye" class="w-5 h-5" id="eyeIcon2"></i>
                        </button>
                    </div>
                </div>

                <!-- Agreement -->
                <div class="rise delay-8 mb-6 flex items-start gap-2.5">
                    <input type="checkbox" id="agreement" class="checkbox-custom mt-0.5">
                    <label for="agreement" class="text-[12px] text-[var(--mh-text-light)] leading-relaxed cursor-pointer">
                        我已阅读并同意
                        <a href="#" class="link-text">用户协议</a>
                        和
                        <a href="#" class="link-text">隐私政策</a>
                    </label>
                </div>

                <!-- Submit Button -->
                <div class="rise delay-9">
                    <button 
                        type="submit" 
                        id="submitBtn"
                        class="btn-primary w-full h-14 rounded-[18px] text-[16px] font-bold flex items-center justify-center gap-2"
                    >
                        <span>下一步</span>
                        <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </button>
                </div>
            </form>
        </section>

        <!-- Bottom Login Link -->
        <div class="rise delay-9 relative z-10 px-6 pb-10 pt-2 flex items-center justify-center gap-1.5">
            <span class="text-[13px] text-[var(--mh-text-light)]">已有账号？</span>
            <a href="#" class="link-text text-[13px]">去登录</a>
        </div>

    </div>

    <script>
        lucide.createIcons();

        // Clock
        const now = new Date();
        const clockStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('clock').textContent = clockStr;

        // Password visibility toggle
        const passwordInput = document.getElementById('password');
        const togglePwdBtn = document.getElementById('togglePwd');
        const eyeIcon = document.getElementById('eyeIcon');
        let pwdVisible = false;

        togglePwdBtn.addEventListener('click', function() {
            pwdVisible = !pwdVisible;
            passwordInput.type = pwdVisible ? 'text' : 'password';
            eyeIcon.setAttribute('data-lucide', pwdVisible ? 'eye-off' : 'eye');
            lucide.createIcons();
        });

        const confirmPwdInput = document.getElementById('confirmPassword');
        const toggleConfirmPwdBtn = document.getElementById('toggleConfirmPwd');
        const eyeIcon2 = document.getElementById('eyeIcon2');
        let confirmPwdVisible = false;

        toggleConfirmPwdBtn.addEventListener('click', function() {
            confirmPwdVisible = !confirmPwdVisible;
            confirmPwdInput.type = confirmPwdVisible ? 'text' : 'password';
            eyeIcon2.setAttribute('data-lucide', confirmPwdVisible ? 'eye-off' : 'eye');
            lucide.createIcons();
        });

        // Password strength indicator
        const strBar1 = document.getElementById('strBar1');
        const strBar2 = document.getElementById('strBar2');
        const strBar3 = document.getElementById('strBar3');
        const strText = document.getElementById('strText');

        function checkStrength(pwd) {
            let score = 0;
            if (pwd.length >= 6) score++;
            if (pwd.length >= 10) score++;
            if (/[a-z]/.test(pwd) && /[A-Z]/.test(pwd)) score++;
            else if (/[a-zA-Z]/.test(pwd) && /\d/.test(pwd)) score++;
            if (/[^a-zA-Z0-9]/.test(pwd)) score++;
            if (pwd.length >= 12 && /[a-z]/.test(pwd) && /[A-Z]/.test(pwd) && /\d/.test(pwd)) score++;
            return score;
        }

        function updateStrength() {
            const pwd = passwordInput.value;
            const score = checkStrength(pwd);

            // Reset
            strBar1.style.background = 'var(--mh-border)';
            strBar2.style.background = 'var(--mh-border)';
            strBar3.style.background = 'var(--mh-border)';
            strText.textContent = '弱';
            strText.style.color = 'var(--mh-text-muted)';

            if (pwd.length === 0) return;

            if (score <= 1) {
                // Weak - red
                strBar1.style.background = 'var(--mh-error)';
                strText.textContent = '弱';
                strText.style.color = 'var(--mh-error)';
            } else if (score <= 3) {
                // Medium - yellow/orange
                strBar1.style.background = 'var(--mh-accent)';
                strBar2.style.background = 'var(--mh-accent)';
                strText.textContent = '中';
                strText.style.color = 'var(--mh-accent-foreground)';
            } else {
                // Strong - green
                strBar1.style.background = 'var(--mh-secondary)';
                strBar2.style.background = 'var(--mh-secondary)';
                strBar3.style.background = 'var(--mh-secondary)';
                strText.textContent = '强';
                strText.style.color = 'var(--mh-secondary)';
            }
        }

        passwordInput.addEventListener('input', updateStrength);

        // Verification code countdown
        const codeBtn = document.getElementById('codeBtn');
        let countdown = 0;
        let timer = null;

        codeBtn.addEventListener('click', function() {
            const phone = document.getElementById('phone').value;
            if (!phone || phone.length !== 11) {
                // Simple validation feedback
                const phoneInput = document.getElementById('phone');
                phoneInput.parentElement.style.borderColor = 'var(--mh-error)';
                setTimeout(() => {
                    phoneInput.parentElement.style.borderColor = '';
                }, 1500);
                return;
            }

            if (countdown > 0) return;

            countdown = 60;
            codeBtn.disabled = true;
            codeBtn.textContent = `${countdown}s 后重发`;

            timer = setInterval(() => {
                countdown--;
                if (countdown <= 0) {
                    clearInterval(timer);
                    codeBtn.disabled = false;
                    codeBtn.textContent = '获取验证码';
                } else {
                    codeBtn.textContent = `${countdown}s 后重发`;
                }
            }, 1000);
        });

        // Form submit
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const agreement = document.getElementById('agreement');
            if (!agreement.checked) {
                agreement.parentElement.style.animation = 'none';
                agreement.parentElement.offsetHeight; // trigger reflow
                agreement.parentElement.style.animation = 'shake 0.4s ease';
                return;
            }
            // Animate to next step (visual feedback)
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerHTML = '<i data-lucide="check" class="w-5 h-5"></i><span>提交中...</span>';
            lucide.createIcons();
            submitBtn.style.transform = 'scale(0.98)';

            setTimeout(() => {
                // Simulate step transition
                document.getElementById('line1').style.width = '100%';
                submitBtn.innerHTML = '<span>下一步</span><i data-lucide="arrow-right" class="w-5 h-5"></i>';
                lucide.createIcons();
                submitBtn.style.transform = '';
            }, 1200);
        });

        // Add shake animation dynamically
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                20%, 60% { transform: translateX(-4px); }
                40%, 80% { transform: translateX(4px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
