<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>登录 - 情绪健康管理平台</title>
    <link rel="stylesheet" href="../colors_and_type.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#e8834a',
                        secondary: '#8aab7c',
                        accent: '#f0b860',
                        warm: '#fdf2e8',
                        card: '#fffdf9',
                        muted: '#faf5ee',
                        border: '#e8ddd0',
                        text: '#4a3f38',
                        'text-light': '#8c8078',
                        'text-muted': '#b0a69c',
                    },
                    fontFamily: {
                        display: ['"Noto Serif SC"', 'Georgia', 'Songti SC', 'serif'],
                        body: ['-apple-system', 'BlinkMacSystemFont', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif'],
                    },
                    boxShadow: {
                        'warm-sm': '0 2px 8px rgba(180, 140, 100, 0.08)',
                        'warm-md': '0 4px 16px rgba(180, 140, 100, 0.10)',
                        'warm-lg': '0 8px 32px rgba(180, 140, 100, 0.14)',
                        'glow': '0 0 40px rgba(240, 184, 96, 0.12)',
                        'primary-glow': '0 8px 24px rgba(232, 131, 74, 0.28)',
                        'input-focus': '0 0 0 4px rgba(232, 131, 74, 0.15), 0 4px 16px rgba(232, 131, 74, 0.12)',
                    },
                    borderRadius: {
                        'xl-custom': '24px',
                    },
                    animation: {
                        'float-slow': 'float 8s ease-in-out infinite',
                        'float-medium': 'float 6s ease-in-out infinite',
                        'float-fast': 'float 5s ease-in-out infinite',
                        'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pulse-soft': 'pulseSoft 3s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translate(0, 0) scale(1)' },
                            '33%': { transform: 'translate(10px, -15px) scale(1.05)' },
                            '66%': { transform: 'translate(-8px, 8px) scale(0.97)' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(24px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        pulseSoft: {
                            '0%, 100%': { opacity: '0.5' },
                            '50%': { opacity: '0.75' },
                        },
                    },
                },
            },
        }
    </script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--mh-font-body);
            background: var(--mh-background);
            color: var(--mh-text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 极光渐变背景 */
        .aurora-bg {
            background:
                radial-gradient(ellipse 100% 60% at 30% -5%, rgba(240, 184, 96, 0.4) 0%, transparent 55%),
                radial-gradient(ellipse 90% 70% at 100% 20%, rgba(232, 131, 74, 0.28) 0%, transparent 50%),
                radial-gradient(ellipse 80% 60% at 0% 85%, rgba(138, 171, 124, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse 100% 50% at 70% 100%, rgba(240, 184, 96, 0.2) 0%, transparent 55%),
                linear-gradient(180deg, #fff9f4 0%, #fef3ea 45%, #fdf6ef 100%);
        }

        /* 浮动光球 */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(50px);
            pointer-events: none;
            opacity: 0.5;
        }

        .orb-1 {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(240, 184, 96, 0.6) 0%, rgba(240, 184, 96, 0) 70%);
            top: -30px;
            right: -40px;
        }

        .orb-2 {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, rgba(232, 131, 74, 0.5) 0%, rgba(232, 131, 74, 0) 70%);
            top: 30%;
            left: -50px;
        }

        .orb-3 {
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, rgba(138, 171, 124, 0.4) 0%, rgba(138, 171, 124, 0) 70%);
            bottom: 15%;
            right: -30px;
        }

        .orb-4 {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(240, 184, 96, 0.35) 0%, rgba(240, 184, 96, 0) 70%);
            bottom: -20px;
            left: 20%;
        }

        /* 玻璃态卡片 */
        .glass-card {
            background: rgba(255, 253, 249, 0.72);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 8px 32px rgba(180, 140, 100, 0.12);
        }

        /* 玻璃态输入框 */
        .glass-input {
            background: rgba(255, 253, 249, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(232, 221, 208, 0.8);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-input:focus-within {
            border-color: rgba(232, 131, 74, 0.5);
            box-shadow: 0 0 0 4px rgba(232, 131, 74, 0.12), 0 4px 20px rgba(232, 131, 74, 0.1);
            background: rgba(255, 253, 249, 0.95);
        }

        .glass-input input {
            background: transparent;
            outline: none;
            border: none;
            width: 100%;
            font-size: 15px;
            color: #4a3f38;
        }

        .glass-input input::placeholder {
            color: #b0a69c;
        }

        /* Logo 渐变圆形 */
        .logo-circle {
            background: linear-gradient(135deg, #f0b860 0%, #e8834a 50%, #8aab7c 100%);
            box-shadow: 0 12px 40px rgba(232, 131, 74, 0.35), 0 0 60px rgba(240, 184, 96, 0.2);
        }

        .logo-circle-inner {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* 主按钮渐变 */
        .btn-primary {
            background: linear-gradient(135deg, #f0b860 0%, #e8834a 100%);
            box-shadow: 0 8px 24px rgba(232, 131, 74, 0.32);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(232, 131, 74, 0.4);
        }

        .btn-primary:active {
            transform: scale(0.97) translateY(0);
            box-shadow: 0 4px 12px rgba(232, 131, 74, 0.25);
        }

        /* 第三方登录按钮 */
        .social-btn {
            background: rgba(255, 253, 249, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(232, 221, 208, 0.7);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .social-btn:hover {
            transform: translateY(-2px);
            border-color: rgba(232, 131, 74, 0.35);
            box-shadow: 0 6px 20px rgba(232, 131, 74, 0.15);
        }

        .social-btn:active {
            transform: scale(0.94);
        }

        /* 分割线 */
        .divider-line {
            background: linear-gradient(90deg, transparent 0%, rgba(232, 221, 208, 0.8) 50%, transparent 100%);
        }

        /* 复选框自定义 */
        .custom-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 1.5px solid #d4c4b0;
            border-radius: 5px;
            background: rgba(255, 253, 249, 0.9);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .custom-checkbox:checked {
            background: linear-gradient(135deg, #f0b860 0%, #e8834a 100%);
            border-color: #e8834a;
        }

        .custom-checkbox:checked::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 5px;
            width: 5px;
            height: 9px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* 渐变文字 */
        .text-gradient-warm {
            background: linear-gradient(135deg, #e8834a 0%, #f0b860 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 渐入动画延迟 */
        .stagger-1 { animation-delay: 0.1s; opacity: 0; }
        .stagger-2 { animation-delay: 0.2s; opacity: 0; }
        .stagger-3 { animation-delay: 0.3s; opacity: 0; }
        .stagger-4 { animation-delay: 0.4s; opacity: 0; }
        .stagger-5 { animation-delay: 0.5s; opacity: 0; }
        .stagger-6 { animation-delay: 0.6s; opacity: 0; }
        .stagger-7 { animation-delay: 0.7s; opacity: 0; }
        .stagger-8 { animation-delay: 0.8s; opacity: 0; }

        /* 状态栏 */
        .status-bar {
            padding-top: env(safe-area-inset-top, 12px);
        }

        /* 底部安全区 */
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        /* 密码可见切换按钮 */
        .toggle-password {
            color: #b0a69c;
            transition: color 0.2s ease;
        }

        .toggle-password:hover {
            color: #e8834a;
        }

        /* 链接样式 */
        .link-text {
            position: relative;
            transition: color 0.2s ease;
        }

        .link-text::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1.5px;
            background: linear-gradient(90deg, #e8834a, #f0b860);
            transition: width 0.3s ease;
        }

        .link-text:hover::after {
            width: 100%;
        }
    </style>
</head>
<body class="aurora-bg min-h-screen relative">

    <!-- 浮动光球装饰 -->
    <div class="orb orb-1 animate-float-slow"></div>
    <div class="orb orb-2 animate-float-medium" style="animation-delay: -2s;"></div>
    <div class="orb orb-3 animate-float-fast" style="animation-delay: -1s;"></div>
    <div class="orb orb-4 animate-float-slow" style="animation-delay: -3s;"></div>

    <!-- 主容器 - 移动端宽度限制 -->
    <div class="mx-auto w-full max-w-[480px] min-h-screen relative flex flex-col">

        <!-- 顶部状态栏 -->
        <div class="status-bar flex items-center justify-between px-6 pt-3 pb-1 text-text text-sm font-medium">
            <span id="status-time" class="font-semibold">9:41</span>
            <div class="flex items-center gap-1.5">
                <i data-lucide="signal" class="w-4 h-4"></i>
                <i data-lucide="wifi" class="w-4 h-4"></i>
                <i data-lucide="battery-full" class="w-5 h-5"></i>
            </div>
        </div>

        <!-- 主要内容区 -->
        <div class="flex-1 flex flex-col px-7 pt-4 pb-6 safe-bottom">

            <!-- Logo 区域 -->
            <div class="flex flex-col items-center stagger-1 animate-fade-in-up">
                <div class="logo-circle w-24 h-24 rounded-full flex items-center justify-center relative mb-5">
                    <div class="logo-circle-inner w-20 h-20 rounded-full flex items-center justify-center">
                        <i data-lucide="heart-handshake" class="w-10 h-10 text-white drop-shadow-sm"></i>
                    </div>
                    <!-- 光晕效果 -->
                    <div class="absolute inset-0 rounded-full animate-pulse-soft" style="box-shadow: 0 0 40px rgba(240, 184, 96, 0.3);"></div>
                </div>
                <h1 class="font-display text-2xl font-semibold text-text tracking-wide mb-1.5">
                    情绪健康管理平台
                </h1>
                <p class="text-text-light text-sm tracking-wider">
                    用心呵护每一份情绪
                </p>
            </div>

            <!-- 欢迎文案 -->
            <div class="mt-10 mb-8 stagger-2 animate-fade-in-up">
                <h2 class="font-display text-3xl font-semibold text-text mb-2">
                    欢迎回来
                </h2>
                <p class="text-text-light text-base">
                    登录你的账号，继续情绪觉察之旅
                </p>
            </div>

            <!-- 表单区域 -->
            <form id="loginForm" class="space-y-4 stagger-3 animate-fade-in-up" onsubmit="handleLogin(event)">

                <!-- 手机号/用户名输入框 -->
                <div class="glass-input rounded-2xl px-5 py-4 flex items-center gap-3.5">
                    <i data-lucide="user" class="w-5 h-5 text-primary flex-shrink-0"></i>
                    <input
                        type="text"
                        id="username"
                        placeholder="手机号 / 用户名"
                        autocomplete="username"
                        class="flex-1 font-body"
                    >
                </div>

                <!-- 密码输入框 -->
                <div class="glass-input rounded-2xl px-5 py-4 flex items-center gap-3.5">
                    <i data-lucide="lock" class="w-5 h-5 text-primary flex-shrink-0"></i>
                    <input
                        type="password"
                        id="password"
                        placeholder="请输入密码"
                        autocomplete="current-password"
                        class="flex-1 font-body"
                    >
                    <button type="button" class="toggle-password p-1" onclick="togglePassword()">
                        <i data-lucide="eye" id="eyeIcon" class="w-5 h-5"></i>
                    </button>
                </div>

                <!-- 记住我 + 忘记密码 -->
                <div class="flex items-center justify-between pt-1">
                    <label class="flex items-center gap-2.5 cursor-pointer group">
                        <input type="checkbox" class="custom-checkbox" id="remember">
                        <span class="text-text-light text-sm group-hover:text-text transition-colors">记住我</span>
                    </label>
                    <a href="#" class="link-text text-primary text-sm font-medium">
                        忘记密码？
                    </a>
                </div>

                <!-- 登录按钮 -->
                <button
                    type="submit"
                    class="btn-primary w-full py-4.5 rounded-full text-white font-semibold text-base mt-6 flex items-center justify-center gap-2 h-[56px]"
                >
                    <span>登录</span>
                    <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>

            </form>

            <!-- 其他登录方式 -->
            <div class="mt-8 stagger-4 animate-fade-in-up">
                <div class="flex items-center gap-4 mb-6">
                    <div class="flex-1 h-px divider-line"></div>
                    <span class="text-text-muted text-xs">或使用以下方式登录</span>
                    <div class="flex-1 h-px divider-line"></div>
                </div>

                <div class="flex items-center justify-center gap-6">
                    <!-- 微信 -->
                    <button type="button" class="social-btn w-14 h-14 rounded-full flex items-center justify-center" aria-label="微信登录">
                        <i data-lucide="message-circle" class="w-6 h-6 text-secondary"></i>
                    </button>
                    <!-- QQ -->
                    <button type="button" class="social-btn w-14 h-14 rounded-full flex items-center justify-center" aria-label="QQ登录">
                        <svg class="w-6 h-6 text-[#5ba7e8]" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12c0 1.82.49 3.53 1.35 5.01L2 22l4.99-1.35A9.93 9.93 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.4 0-2.74-.35-3.92-.98l-.28-.16-2.88.78.78-2.88-.16-.28A7.96 7.96 0 0 1 4 12c0-4.42 3.58-8 8-8s8 3.58 8 8-3.58 8-8 8z"/>
                            <circle cx="9" cy="10" r="1.5"/>
                            <circle cx="15" cy="10" r="1.5"/>
                        </svg>
                    </button>
                    <!-- 邮箱 -->
                    <button type="button" class="social-btn w-14 h-14 rounded-full flex items-center justify-center" aria-label="邮箱登录">
                        <i data-lucide="mail" class="w-6 h-6 text-accent"></i>
                    </button>
                </div>
            </div>

            <!-- 底部注册引导 -->
            <div class="mt-auto pt-8 stagger-5 animate-fade-in-up">
                <p class="text-center text-text-light text-sm">
                    还没有账号？
                    <a href="#" class="link-text text-primary font-semibold">立即注册</a>
                </p>
            </div>

            <!-- 底部免责声明 -->
            <div class="mt-4 stagger-6 animate-fade-in-up">
                <p class="text-center text-text-muted text-xs leading-relaxed">
                    登录即表示同意
                    <a href="#" class="text-text-light hover:text-primary transition-colors">用户协议</a>
                    和
                    <a href="#" class="text-text-light hover:text-primary transition-colors">隐私政策</a>
                </p>
            </div>

        </div>
    </div>

    <script>
        // 初始化 Lucide 图标
        lucide.createIcons();

        // 更新状态栏时间
        function updateStatusTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('status-time').textContent = `${hours}:${minutes}`;
        }
        updateStatusTime();
        setInterval(updateStatusTime, 60000);

        // 密码可见性切换
        let passwordVisible = false;
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            passwordVisible = !passwordVisible;
            passwordInput.type = passwordVisible ? 'text' : 'password';

            if (passwordVisible) {
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        // 登录表单提交
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            const btn = event.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>';
            lucide.createIcons();
            btn.disabled = true;
            btn.style.opacity = '0.8';

            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                btn.style.opacity = '1';
                lucide.createIcons();
                alert('登录功能演示：\n用户名：' + username + '\n记住我：' + (remember ? '是' : '否'));
            }, 1500);
        }

        // 输入框聚焦动画增强
        const inputs = document.querySelectorAll('.glass-input input');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'translateY(-1px)';
            });
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'translateY(0)';
            });
        });

        // 第三方登录按钮点击反馈
        document.querySelectorAll('.social-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const label = this.getAttribute('aria-label');
                this.style.transform = 'scale(0.92)';
                setTimeout(() => {
                    this.style.transform = '';
                    alert(label + '功能演示');
                }, 150);
            });
        });
    </script>
</body>
</html>
