<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>提升计划 - 情绪健康管理平台</title>
    <link rel="stylesheet" href="../colors_and_type.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        @keyframes drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(8px, -12px) scale(1.03); }
            66% { transform: translate(-6px, 6px) scale(0.98); }
        }
        @keyframes breathe {
            0%, 100% { opacity: 0.45; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.06); }
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .rise { animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.08s; }
        .delay-2 { animation-delay: 0.16s; }
        .delay-3 { animation-delay: 0.24s; }
        .delay-4 { animation-delay: 0.32s; }
        .delay-5 { animation-delay: 0.40s; }
        .delay-6 { animation-delay: 0.48s; }
        .delay-7 { animation-delay: 0.56s; }

        body {
            background-color: var(--mh-background);
            color: var(--mh-text);
        }

        .aurora {
            background:
                radial-gradient(ellipse 120% 80% at 20% -10%, rgba(240, 184, 96, 0.32) 0%, transparent 50%),
                radial-gradient(ellipse 100% 90% at 90% 5%, rgba(232, 131, 74, 0.18) 0%, transparent 45%),
                radial-gradient(ellipse 80% 70% at 70% 95%, rgba(138, 171, 124, 0.16) 0%, transparent 45%),
                linear-gradient(180deg, #fff9f4 0%, #fef3ea 50%, #fdf6ef 100%);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            pointer-events: none;
        }

        .glass-surface {
            background: rgba(255, 253, 249, 0.78);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .card {
            background: var(--mh-card);
            border: 1px solid var(--mh-border);
            box-shadow: var(--mh-shadow-sm);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--mh-shadow-md);
            border-color: rgba(232, 131, 74, 0.22);
        }

        .btn-main {
            background: linear-gradient(135deg, #f0b860 0%, #e8834a 100%);
            color: white;
            box-shadow: 0 8px 24px rgba(232, 131, 74, 0.28);
            transition: all 0.25s ease;
        }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(232, 131, 74, 0.36); }
        .btn-main:active { transform: scale(0.97); }

        .btn-soft {
            background: var(--mh-surface-muted);
            color: var(--mh-text);
            border: 1px solid var(--mh-border);
            transition: all 0.2s ease;
        }
        .btn-soft:hover { background: var(--mh-border); }

        .text-gradient {
            background: linear-gradient(135deg, var(--mh-primary) 0%, var(--mh-accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-pill {
            background: rgba(255, 253, 249, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(232, 221, 208, 0.6);
            box-shadow: 0 8px 32px rgba(180, 140, 100, 0.14);
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Sub-nav active indicator */
        .sub-nav-item {
            position: relative;
            padding-bottom: 8px;
            transition: color 0.25s ease;
        }
        .sub-nav-item.active {
            color: var(--mh-primary);
            font-weight: 600;
        }
        .sub-nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            border-radius: 2px;
            background: linear-gradient(90deg, var(--mh-primary), var(--mh-accent));
        }

        /* Category pill */
        .category-pill {
            padding: 7px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.25s ease;
            border: 1px solid transparent;
        }
        .category-pill.active {
            background: linear-gradient(135deg, #f0b860 0%, #e8834a 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(232, 131, 74, 0.25);
        }
        .category-pill:not(.active) {
            background: var(--mh-card);
            color: var(--mh-text-light);
            border-color: var(--mh-border);
        }
        .category-pill:not(.active):hover {
            color: var(--mh-primary);
            border-color: rgba(232, 131, 74, 0.3);
        }

        /* Banner gradient - purple blue */
        .banner-gradient {
            background: linear-gradient(135deg, #7b68ee 0%, #6a89cc 50%, #4a90d9 100%);
        }

        /* Course card cover gradients */
        .cover-group {
            background: linear-gradient(135deg, #9b8ec4 0%, #c090d0 50%, #d4a5e0 100%);
        }
        .cover-course {
            background: linear-gradient(135deg, #6a9bd4 0%, #7ba5c4 50%, #9bc0d8 100%);
        }
        .cover-assess {
            background: linear-gradient(135deg, #e8834a 0%, #f0a070 50%, #f5b890 100%);
        }

        .tag-purple {
            background: rgba(156, 139, 200, 0.15);
            color: #7b68ee;
        }
        .tag-blue {
            background: rgba(106, 155, 212, 0.15);
            color: #5a8ac0;
        }
        .tag-orange {
            background: rgba(232, 131, 74, 0.15);
            color: var(--mh-primary);
        }
        .tag-hot {
            background: rgba(224, 85, 106, 0.9);
            color: white;
        }
        .tag-free {
            background: rgba(138, 171, 124, 0.9);
            color: white;
        }
    </style>
</head>
<body class="antialiased min-h-screen">

    <div class="aurora min-h-screen w-full max-w-[480px] mx-auto relative overflow-hidden pb-[calc(88px+env(safe-area-inset-bottom))]">

        <!-- Organic Background Orbs -->
        <div class="orb w-72 h-72 bg-[var(--mh-accent)]/25 -top-24 -left-24" style="animation: drift 12s ease-in-out infinite;"></div>
        <div class="orb w-64 h-64 bg-[var(--mh-primary)]/18 top-1/3 -right-20" style="animation: drift 15s ease-in-out infinite 1s;"></div>
        <div class="orb w-56 h-56 bg-[var(--mh-secondary)]/14 bottom-40 -left-16" style="animation: drift 14s ease-in-out infinite 2s;"></div>
        <div class="orb w-80 h-80 bg-[var(--mh-accent)]/10 -bottom-32 right-1/4" style="animation: breathe 8s ease-in-out infinite;"></div>

        <!-- Status Bar -->
        <div class="rise flex items-center justify-between px-6 pt-4 pb-2 text-[13px] font-semibold text-[var(--mh-text)] relative z-10">
            <span id="clock">9:41</span>
            <div class="flex items-center gap-1.5">
                <i data-lucide="signal" class="w-4 h-4"></i>
                <i data-lucide="wifi" class="w-4 h-4"></i>
                <i data-lucide="battery-full" class="w-5 h-5"></i>
            </div>
        </div>

        <!-- Top Bar with Back -->
        <div class="rise delay-1 relative z-10 px-4 pt-2 pb-3 flex items-center">
            <button class="w-10 h-10 rounded-full glass-surface flex items-center justify-center text-[var(--mh-text)] active:scale-95 transition-transform">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </button>
            <h1 class="flex-1 text-center text-[17px] font-semibold text-[var(--mh-text)]" style="font-family: var(--mh-font-display);">提升计划</h1>
            <div class="w-10 h-10"></div>
        </div>

        <!-- Header -->
        <header class="rise delay-2 relative z-10 px-6 pt-2 pb-5">
            <h2 class="text-[28px] font-bold text-[var(--mh-text)] leading-tight" style="font-family: var(--mh-font-display);">
                提升计划
            </h2>
            <p class="text-[13px] text-[var(--mh-text-light)] mt-2 leading-relaxed">
                通过科学的课程和活动，逐步提升情绪管理能力
            </p>
        </header>

        <!-- Sub Navigation Tabs -->
        <nav class="rise delay-2 relative z-10 px-6 pb-3">
            <div class="flex items-center justify-between gap-2">
                <button class="sub-nav-item active text-[14px]">团体辅导</button>
                <button class="sub-nav-item text-[14px] text-[var(--mh-text-light)]">情绪科普</button>
                <button class="sub-nav-item text-[14px] text-[var(--mh-text-light)]">成长课程</button>
                <button class="sub-nav-item text-[14px] text-[var(--mh-text-light)]">问卷调查</button>
            </div>
        </nav>

        <!-- Search Bar -->
        <div class="rise delay-3 relative z-10 px-6 pb-5">
            <div class="glass-surface h-11 rounded-full flex items-center px-4 gap-2.5 shadow-[var(--mh-shadow-sm)]">
                <i data-lucide="search" class="w-4 h-4 text-[var(--mh-text-muted)]"></i>
                <input type="text" placeholder="搜索课程、活动..."
                    class="flex-1 bg-transparent border-none outline-none text-[13px] text-[var(--mh-text)] placeholder:text-[var(--mh-text-muted)]" />
            </div>
        </div>

        <!-- Recommended Banner -->
        <section class="rise delay-4 px-6 pb-5 relative z-10">
            <div class="banner-gradient rounded-[24px] p-5 relative overflow-hidden shadow-[var(--mh-shadow-md)] active:scale-[0.99] transition-transform cursor-pointer">
                <!-- Decorative elements -->
                <div class="absolute -right-8 -top-8 w-36 h-36 rounded-full bg-white/10 blur-2xl"></div>
                <div class="absolute -left-6 -bottom-10 w-28 h-28 rounded-full bg-white/8 blur-xl"></div>
                <div class="absolute right-6 top-4 w-16 h-16 rounded-full bg-white/10 backdrop-blur-sm flex items-center justify-center" style="animation: float 4s ease-in-out infinite;">
                    <i data-lucide="sparkles" class="w-7 h-7 text-white/70"></i>
                </div>

                <div class="relative z-10">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="tag-hot text-[10px] font-bold px-2.5 py-1 rounded-full flex items-center gap-1">
                            <i data-lucide="flame" class="w-3 h-3 fill-current"></i>
                            热门
                        </span>
                        <span class="tag-free text-[10px] font-bold px-2.5 py-1 rounded-full flex items-center gap-1">
                            <i data-lucide="gift" class="w-3 h-3"></i>
                            免费
                        </span>
                    </div>
                    <h3 class="text-[20px] font-bold text-white mb-2" style="font-family: var(--mh-font-display);">
                        情绪管理入门课
                    </h3>
                    <p class="text-[13px] text-white/80 leading-relaxed mb-4 max-w-[240px]">
                        7天学会识别和调节情绪，开启自我觉察之旅
                    </p>
                    <button class="h-10 px-5 rounded-full bg-white text-[#5a6ab0] text-[13px] font-bold flex items-center gap-1.5 shadow-lg hover:shadow-xl transition-shadow">
                        立即参与
                        <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- Category Filter -->
        <section class="rise delay-5 px-6 pb-4 relative z-10">
            <div class="flex items-center gap-2 overflow-x-auto hide-scrollbar pb-1">
                <button class="category-pill active">全部</button>
                <button class="category-pill">情绪管理</button>
                <button class="category-pill">压力应对</button>
                <button class="category-pill">人际关系</button>
                <button class="category-pill">自我成长</button>
            </div>
        </section>

        <!-- Course Cards List -->
        <section class="rise delay-6 px-6 pb-6 relative z-10 space-y-4">

            <!-- Card 1: 团体辅导 -->
            <div class="card rounded-[22px] overflow-hidden">
                <div class="cover-group h-36 relative flex items-center justify-center overflow-hidden">
                    <!-- Decorative SVG blobs -->
                    <div class="absolute inset-0 opacity-25">
                        <svg viewBox="0 0 200 140" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
                            <path fill="#ffffff" d="M30,70 Q30,30 70,30 T110,30 Q150,30 160,70 T110,110 Q70,110 50,90 Q30,80 30,70Z" opacity="0.4" style="animation: drift 18s ease-in-out infinite; transform-origin: center;" />
                        </svg>
                    </div>
                    <div class="relative z-10 flex items-center gap-3" style="animation: float 5s ease-in-out infinite;">
                        <div class="w-12 h-12 rounded-full bg-white/25 backdrop-blur-sm flex items-center justify-center">
                            <i data-lucide="users" class="w-6 h-6 text-white"></i>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-sm flex items-center justify-center -ml-4">
                            <i data-lucide="heart" class="w-5 h-5 text-white"></i>
                        </div>
                    </div>
                </div>
                <div class="p-4">
                    <span class="inline-flex items-center px-2.5 py-1 rounded-full tag-purple text-[10px] font-bold mb-2">
                        团体辅导
                    </span>
                    <h3 class="text-[16px] font-semibold text-[var(--mh-text)]" style="font-family: var(--mh-font-display);">
                        正念减压小组 · 第12期
                    </h3>
                    <p class="text-[12px] text-[var(--mh-text-light)] mt-1.5 leading-relaxed">
                        8周团体课程，每周1次90分钟，系统学习正念减压
                    </p>
                    <div class="flex items-center gap-3 mt-3.5 text-[11px] text-[var(--mh-text-muted)]">
                        <span class="flex items-center gap-1">
                            <i data-lucide="users" class="w-3.5 h-3.5"></i>
                            24人已报名
                        </span>
                        <span class="flex items-center gap-1">
                            <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                            每周二晚
                        </span>
                        <span class="flex items-center gap-1 text-[var(--mh-accent)] font-semibold">
                            <i data-lucide="star" class="w-3.5 h-3.5 fill-current"></i>
                            4.9分
                        </span>
                    </div>
                </div>
            </div>

            <!-- Card 2: 成长课程 -->
            <div class="card rounded-[22px] overflow-hidden">
                <div class="cover-course h-36 relative flex items-center justify-center overflow-hidden">
                    <div class="absolute inset-0 opacity-25">
                        <svg viewBox="0 0 200 140" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
                            <path fill="#ffffff" d="M30,70 Q30,30 70,30 T110,30 Q150,30 160,70 T110,110 Q70,110 50,90 Q30,80 30,70Z" opacity="0.4" style="animation: drift 20s ease-in-out infinite 1s; transform-origin: center;" />
                        </svg>
                    </div>
                    <div class="relative z-10" style="animation: float 4.5s ease-in-out infinite 0.5s;">
                        <div class="w-14 h-14 rounded-2xl bg-white/25 backdrop-blur-sm flex items-center justify-center shadow-lg">
                            <i data-lucide="book-open" class="w-7 h-7 text-white"></i>
                        </div>
                    </div>
                </div>
                <div class="p-4">
                    <span class="inline-flex items-center px-2.5 py-1 rounded-full tag-blue text-[10px] font-bold mb-2">
                        成长课程
                    </span>
                    <h3 class="text-[16px] font-semibold text-[var(--mh-text)]" style="font-family: var(--mh-font-display);">
                        认知行为疗法入门
                    </h3>
                    <p class="text-[12px] text-[var(--mh-text-light)] mt-1.5 leading-relaxed">
                        10节视频课，学习CBT核心技术，改善负面思维
                    </p>
                    <div class="flex items-center gap-3 mt-3.5 text-[11px] text-[var(--mh-text-muted)]">
                        <span class="flex items-center gap-1">
                            <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                            3.5小时
                        </span>
                        <span class="flex items-center gap-1">
                            <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                            1.2k人学习
                        </span>
                        <span class="flex items-center gap-1 text-[var(--mh-accent)] font-semibold">
                            <i data-lucide="star" class="w-3.5 h-3.5 fill-current"></i>
                            4.8分
                        </span>
                    </div>
                </div>
            </div>

            <!-- Card 3: 问卷调查/心理测评 -->
            <div class="card rounded-[22px] overflow-hidden">
                <div class="cover-assess h-36 relative flex items-center justify-center overflow-hidden">
                    <div class="absolute inset-0 opacity-25">
                        <svg viewBox="0 0 200 140" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
                            <path fill="#ffffff" d="M30,70 Q30,30 70,30 T110,30 Q150,30 160,70 T110,110 Q70,110 50,90 Q30,80 30,70Z" opacity="0.4" style="animation: drift 16s ease-in-out infinite 0.5s; transform-origin: center;" />
                        </svg>
                    </div>
                    <div class="relative z-10" style="animation: float 5.5s ease-in-out infinite 1s;">
                        <div class="w-14 h-14 rounded-2xl bg-white/25 backdrop-blur-sm flex items-center justify-center shadow-lg">
                            <i data-lucide="clipboard-list" class="w-7 h-7 text-white"></i>
                        </div>
                    </div>
                </div>
                <div class="p-4">
                    <span class="inline-flex items-center px-2.5 py-1 rounded-full tag-orange text-[10px] font-bold mb-2">
                        心理测评
                    </span>
                    <h3 class="text-[16px] font-semibold text-[var(--mh-text)]" style="font-family: var(--mh-font-display);">
                        抑郁自评量表 SDS
                    </h3>
                    <p class="text-[12px] text-[var(--mh-text-light)] mt-1.5 leading-relaxed">
                        专业心理测评，20题约5分钟，了解自己的情绪状态
                    </p>
                    <div class="flex items-center gap-3 mt-3.5 text-[11px] text-[var(--mh-text-muted)]">
                        <span class="flex items-center gap-1">
                            <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
                            20题
                        </span>
                        <span class="flex items-center gap-1">
                            <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                            5分钟
                        </span>
                        <span class="flex items-center gap-1">
                            已测 3.2k人
                        </span>
                    </div>
                </div>
            </div>

        </section>

        <!-- Bottom Navigation -->
        <nav class="fixed bottom-5 left-1/2 -translate-x-1/2 z-40 w-[calc(100%-40px)] max-w-[400px]">
            <div class="nav-pill rounded-full h-[64px] px-2 flex items-center justify-between">
                <button class="flex flex-col items-center justify-center gap-1 w-12 h-12 rounded-full text-[var(--mh-text-light)] hover:text-[var(--mh-primary)] transition-colors">
                    <i data-lucide="home" class="w-5 h-5"></i>
                    <span class="text-[9px] font-medium">首页</span>
                </button>
                <button class="flex flex-col items-center justify-center gap-1 w-12 h-12 rounded-full text-[var(--mh-text-light)] hover:text-[var(--mh-primary)] transition-colors">
                    <i data-lucide="heart" class="w-5 h-5"></i>
                    <span class="text-[9px] font-medium">情绪</span>
                </button>
                <button class="flex flex-col items-center justify-center gap-1 w-12 h-12 rounded-full text-[var(--mh-text-light)] hover:text-[var(--mh-primary)] transition-colors">
                    <i data-lucide="leaf" class="w-5 h-5"></i>
                    <span class="text-[9px] font-medium">放松</span>
                </button>
                <button class="flex flex-col items-center justify-center gap-1 w-12 h-12 rounded-full text-[var(--mh-primary)] bg-[var(--mh-primary-soft)]">
                    <i data-lucide="trending-up" class="w-5 h-5"></i>
                    <span class="text-[9px] font-semibold">提升</span>
                </button>
                <button class="flex flex-col items-center justify-center gap-1 w-12 h-12 rounded-full text-[var(--mh-text-light)] hover:text-[var(--mh-primary)] transition-colors">
                    <i data-lucide="user" class="w-5 h-5"></i>
                    <span class="text-[9px] font-medium">我的</span>
                </button>
            </div>
        </nav>

    </div>

    <script>
        lucide.createIcons();

        // Clock
        const now = new Date();
        const clockStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('clock').textContent = clockStr;

        // Category pill toggle
        document.querySelectorAll('.category-pill').forEach(pill => {
            pill.addEventListener('click', function() {
                document.querySelectorAll('.category-pill').forEach(p => p.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Sub-nav toggle
        document.querySelectorAll('.sub-nav-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.sub-nav-item').forEach(i => {
                    i.classList.remove('active');
                    i.classList.add('text-[var(--mh-text-light)]');
                });
                this.classList.add('active');
                this.classList.remove('text-[var(--mh-text-light)]');
            });
        });
    </script>
</body>
</html>
