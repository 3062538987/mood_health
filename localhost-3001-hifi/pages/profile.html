<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>个人中心 - 晚晴</title>
    <link rel="stylesheet" href="../colors_and_type.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        @keyframes drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(8px, -12px) scale(1.03); }
            66% { transform: translate(-6px, 6px) scale(0.98); }
        }
        @keyframes breathe {
            0%, 100% { opacity: 0.45; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.06); }
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.3); }
            50% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .rise { animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.08s; }
        .delay-2 { animation-delay: 0.16s; }
        .delay-3 { animation-delay: 0.24s; }
        .delay-4 { animation-delay: 0.32s; }
        .delay-5 { animation-delay: 0.4s; }
        .delay-6 { animation-delay: 0.48s; }
        .delay-7 { animation-delay: 0.56s; }

        body {
            background-color: var(--mh-background);
            color: var(--mh-text);
        }

        .aurora-bg {
            background:
                radial-gradient(ellipse 120% 80% at 20% -10%, rgba(240, 184, 96, 0.35) 0%, transparent 50%),
                radial-gradient(ellipse 100% 90% at 90% 10%, rgba(232, 131, 74, 0.2) 0%, transparent 45%),
                radial-gradient(ellipse 80% 70% at 70% 90%, rgba(138, 171, 124, 0.18) 0%, transparent 45%),
                linear-gradient(180deg, #fff9f4 0%, #fef3ea 50%, #fdf6ef 100%);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            pointer-events: none;
        }

        .glass-card {
            background: rgba(255, 253, 249, 0.78);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .profile-gradient {
            background: linear-gradient(135deg, #e8834a 0%, #f0b860 60%, #f5c97a 100%);
            position: relative;
            overflow: hidden;
        }

        .profile-gradient::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,255,255,0.25) 0%, transparent 70%);
            border-radius: 50%;
        }

        .profile-gradient::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -20%;
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        .avatar-ring {
            animation: pulse-glow 3s ease-out infinite;
        }

        .nav-pill {
            background: rgba(255, 253, 249, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(232, 221, 208, 0.6);
            box-shadow: 0 8px 32px rgba(180, 140, 100, 0.14);
        }

        .menu-group {
            background: var(--mh-card);
            border: 1px solid var(--mh-border);
            box-shadow: var(--mh-shadow-sm);
            transition: all 0.3s ease;
        }

        .menu-item {
            transition: all 0.2s ease;
            position: relative;
        }

        .menu-item:hover {
            background: var(--mh-surface-muted);
        }

        .menu-item:active {
            transform: scale(0.98);
        }

        .menu-item::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 56px;
            right: 16px;
            height: 1px;
            background: var(--mh-border);
            opacity: 0.6;
        }

        .menu-item:last-child::after {
            display: none;
        }

        .badge-locked {
            filter: grayscale(100%);
            opacity: 0.45;
        }

        .badge-unlocked {
            animation: float 3s ease-in-out infinite;
        }

        .badge-unlocked:nth-child(2) { animation-delay: 0.5s; }
        .badge-unlocked:nth-child(3) { animation-delay: 1s; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .stat-item {
            transition: transform 0.25s ease;
        }

        .stat-item:hover {
            transform: translateY(-3px);
        }

        .badge-card {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .badge-card:hover {
            transform: translateY(-4px);
        }

        .logout-btn {
            transition: all 0.25s ease;
        }

        .logout-btn:hover {
            color: var(--mh-error);
            background: rgba(224, 85, 106, 0.08);
        }

        .new-badge {
            animation: breathe 2s ease-in-out infinite;
        }
    </style>
</head>
<body class="antialiased min-h-screen">

    <div class="aurora-bg min-h-screen w-full max-w-[480px] mx-auto relative overflow-hidden pb-[calc(88px+env(safe-area-inset-bottom))]">

        <!-- Organic Background Orbs -->
        <div class="orb w-72 h-72 bg-[var(--mh-accent)]/25 -top-24 -left-24" style="animation: drift 12s ease-in-out infinite;"></div>
        <div class="orb w-64 h-64 bg-[var(--mh-primary)]/18 top-1/4 -right-20" style="animation: drift 15s ease-in-out infinite 1s;"></div>
        <div class="orb w-56 h-56 bg-[var(--mh-secondary)]/14 bottom-32 -left-16" style="animation: drift 14s ease-in-out infinite 2s;"></div>
        <div class="orb w-80 h-80 bg-[var(--mh-accent)]/10 -bottom-32 right-1/4" style="animation: breathe 8s ease-in-out infinite;"></div>

        <!-- Status Bar -->
        <div class="rise flex items-center justify-between px-6 pt-4 pb-2 text-[13px] font-semibold text-white relative z-20">
            <span id="clock">9:41</span>
            <div class="flex items-center gap-1.5">
                <i data-lucide="signal" class="w-4 h-4"></i>
                <i data-lucide="wifi" class="w-4 h-4"></i>
                <i data-lucide="battery-full" class="w-5 h-5"></i>
            </div>
        </div>

        <!-- Profile Header -->
        <header class="rise delay-1 relative z-10">
            <div class="profile-gradient pt-2 pb-24 px-6">
                <!-- Top Bar -->
                <div class="flex items-center justify-between mb-6">
                    <button class="w-10 h-10 rounded-full bg-white/15 backdrop-blur-sm flex items-center justify-center text-white hover:bg-white/25 transition-colors">
                        <i data-lucide="chevron-left" class="w-5 h-5"></i>
                    </button>
                    <h1 class="text-[17px] font-semibold text-white" style="font-family: var(--mh-font-display);">个人中心</h1>
                    <button class="w-10 h-10 rounded-full bg-white/15 backdrop-blur-sm flex items-center justify-center text-white hover:bg-white/25 transition-colors">
                        <i data-lucide="settings" class="w-5 h-5"></i>
                    </button>
                </div>

                <!-- User Info -->
                <div class="flex items-center gap-4 relative z-10">
                    <div class="relative">
                        <div class="w-20 h-20 rounded-full bg-white/25 backdrop-blur-sm p-1 avatar-ring">
                            <div class="w-full h-full rounded-full bg-gradient-to-br from-white to-[var(--mh-primary-soft)] flex items-center justify-center shadow-inner">
                                <span class="text-[28px] font-bold text-gradient" style="font-family: var(--mh-font-display);">晚</span>
                            </div>
                        </div>
                        <div class="absolute -bottom-1 -right-1 w-7 h-7 rounded-full bg-[var(--mh-secondary)] border-2 border-white flex items-center justify-center shadow-md">
                            <i data-lucide="pencil" class="w-3.5 h-3.5 text-white"></i>
                        </div>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h2 class="text-[22px] font-bold text-white leading-tight" style="font-family: var(--mh-font-display);">晚晴</h2>
                        <p class="text-[13px] text-white/80 mt-1 truncate">愿每一天都被温柔以待</p>
                        <button class="mt-3 inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-white/20 backdrop-blur-sm text-white text-[12px] font-medium hover:bg-white/30 transition-all active:scale-95">
                            <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                            编辑资料
                        </button>
                    </div>
                </div>
            </div>

            <!-- Stats Card (floating) -->
            <div class="mx-6 -mt-14 relative z-20">
                <div class="glass-card rounded-[24px] p-5 shadow-[var(--mh-shadow-lg)]">
                    <div class="grid grid-cols-3 gap-2">
                        <div class="stat-item flex flex-col items-center justify-center py-1 cursor-pointer">
                            <p class="text-[24px] font-bold text-[var(--mh-text)]" style="font-family: var(--mh-font-display);">128</p>
                            <p class="text-[11px] text-[var(--mh-text-light)] mt-0.5">情绪记录</p>
                        </div>
                        <div class="stat-item flex flex-col items-center justify-center py-1 cursor-pointer border-x border-[var(--mh-border)]">
                            <div class="flex items-center gap-1">
                                <i data-lucide="flame" class="w-4 h-4 text-[var(--mh-primary)] fill-current"></i>
                                <p class="text-[24px] font-bold text-[var(--mh-text)]" style="font-family: var(--mh-font-display);">7</p>
                            </div>
                            <p class="text-[11px] text-[var(--mh-text-light)] mt-0.5">连续打卡</p>
                        </div>
                        <div class="stat-item flex flex-col items-center justify-center py-1 cursor-pointer">
                            <p class="text-[24px] font-bold text-[var(--mh-text)]" style="font-family: var(--mh-font-display);">3</p>
                            <p class="text-[11px] text-[var(--mh-text-light)] mt-0.5">成长课程</p>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Achievement Badges -->
        <section class="rise delay-3 px-6 pt-6 pb-5 relative z-10">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                    <div class="w-7 h-7 rounded-[10px] bg-gradient-to-br from-[var(--mh-accent)] to-[var(--mh-primary)] flex items-center justify-center">
                        <i data-lucide="trophy" class="w-4 h-4 text-white"></i>
                    </div>
                    <h2 class="text-[17px] font-semibold text-[var(--mh-text)]" style="font-family: var(--mh-font-display);">我的成就</h2>
                </div>
                <button class="text-[12px] font-medium text-[var(--mh-primary)] flex items-center gap-0.5 hover:gap-1.5 transition-all">
                    查看全部
                    <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                </button>
            </div>

            <div class="flex gap-3 overflow-x-auto hide-scrollbar pb-1 -mx-6 px-6">
                <!-- Badge 1 - Unlocked -->
                <div class="badge-card badge-unlocked flex-shrink-0 w-20 flex flex-col items-center gap-2">
                    <div class="w-16 h-16 rounded-[20px] bg-gradient-to-br from-[var(--mh-primary)] to-[var(--mh-accent)] flex items-center justify-center shadow-lg shadow-[var(--mh-primary)]/20">
                        <span class="text-[24px]">🔥</span>
                    </div>
                    <span class="text-[10px] text-[var(--mh-text)] text-center leading-tight font-medium">7天连续<br>记录</span>
                </div>

                <!-- Badge 2 - Unlocked -->
                <div class="badge-card badge-unlocked flex-shrink-0 w-20 flex flex-col items-center gap-2">
                    <div class="w-16 h-16 rounded-[20px] bg-gradient-to-br from-[var(--mh-accent)] to-[var(--mh-mood-happy)] flex items-center justify-center shadow-lg shadow-[var(--mh-accent)]/20">
                        <span class="text-[24px]">😊</span>
                    </div>
                    <span class="text-[10px] text-[var(--mh-text)] text-center leading-tight font-medium">心情<br>探险家</span>
                </div>

                <!-- Badge 3 - Unlocked -->
                <div class="badge-card badge-unlocked flex-shrink-0 w-20 flex flex-col items-center gap-2">
                    <div class="w-16 h-16 rounded-[20px] bg-gradient-to-br from-[#7c5a9c] to-[#a080c0] flex items-center justify-center shadow-lg shadow-[#7c5a9c]/20">
                        <span class="text-[24px]">🌙</span>
                    </div>
                    <span class="text-[10px] text-[var(--mh-text)] text-center leading-tight font-medium">夜间<br>倾诉者</span>
                </div>

                <!-- Badge 4 - Locked -->
                <div class="badge-card flex-shrink-0 w-20 flex flex-col items-center gap-2">
                    <div class="w-16 h-16 rounded-[20px] bg-[var(--mh-surface-muted)] border border-[var(--mh-border)] flex items-center justify-center badge-locked">
                        <span class="text-[24px]">📚</span>
                    </div>
                    <span class="text-[10px] text-[var(--mh-text-muted)] text-center leading-tight font-medium">学习<br>新星</span>
                </div>

                <!-- Badge 5 - Locked -->
                <div class="badge-card flex-shrink-0 w-20 flex flex-col items-center gap-2">
                    <div class="w-16 h-16 rounded-[20px] bg-[var(--mh-surface-muted)] border border-[var(--mh-border)] flex items-center justify-center badge-locked">
                        <span class="text-[24px]">🌿</span>
                    </div>
                    <span class="text-[10px] text-[var(--mh-text-muted)] text-center leading-tight font-medium">治愈<br>园丁</span>
                </div>

                <!-- More -->
                <div class="badge-card flex-shrink-0 w-20 flex flex-col items-center gap-2">
                    <div class="w-16 h-16 rounded-[20px] bg-[var(--mh-surface-muted)] border border-[var(--mh-border)] border-dashed flex items-center justify-center text-[var(--mh-text-muted)]">
                        <i data-lucide="plus" class="w-5 h-5"></i>
                    </div>
                    <span class="text-[10px] text-[var(--mh-text-muted)] text-center leading-tight font-medium">更多<br>成就</span>
                </div>
            </div>
        </section>

        <!-- Menu Group 1 - 我的内容 -->
        <section class="rise delay-4 px-6 pb-4 relative z-10">
            <p class="text-[12px] font-medium text-[var(--mh-text-muted)] mb-2.5 px-1">我的内容</p>
            <div class="menu-group rounded-[20px] overflow-hidden">
                <button class="menu-item w-full flex items-center gap-3 px-4 py-3.5 text-left">
                    <div class="w-9 h-9 rounded-[12px] bg-[var(--mh-primary-soft)] flex items-center justify-center text-[var(--mh-primary)]">
                        <i data-lucide="pen-line" class="w-4.5 h-4.5"></i>
                    </div>
                    <span class="flex-1 text-[14px] font-medium text-[var(--mh-text)]">我的情绪记录</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--mh-text-muted)]"></i>
                </button>
                <button class="menu-item w-full flex items-center gap-3 px-4 py-3.5 text-left">
                    <div class="w-9 h-9 rounded-[12px] bg-[var(--mh-secondary)]/12 flex items-center justify-center text-[var(--mh-secondary)]">
                        <i data-lucide="trees" class="w-4.5 h-4.5"></i>
                    </div>
                    <span class="flex-1 text-[14px] font-medium text-[var(--mh-text)]">我的树洞帖子</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--mh-text-muted)]"></i>
                </button>
                <button class="menu-item w-full flex items-center gap-3 px-4 py-3.5 text-left">
                    <div class="w-9 h-9 rounded-[12px] bg-[var(--mh-accent)]/18 flex items-center justify-center text-[var(--mh-accent-foreground)]">
                        <i data-lucide="bot" class="w-4.5 h-4.5"></i>
                    </div>
                    <span class="flex-1 text-[14px] font-medium text-[var(--mh-text)]">AI 对话历史</span>
                    <div class="flex items-center gap-1.5">
                        <span class="new-badge min-w-[20px] h-5 px-1.5 rounded-full bg-[var(--mh-error)] text-white text-[11px] font-bold flex items-center justify-center">3</span>
                        <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--mh-text-muted)]"></i>
                    </div>
                </button>
            </div>
        </section>

        <!-- Menu Group 2 - 我的成长 -->
        <section class="rise delay-5 px-6 pb-4 relative z-10">
            <p class="text-[12px] font-medium text-[var(--mh-text-muted)] mb-2.5 px-1">我的成长</p>
            <div class="menu-group rounded-[20px] overflow-hidden">
                <button class="menu-item w-full flex items-center gap-3 px-4 py-3.5 text-left">
                    <div class="w-9 h-9 rounded-[12px] bg-[var(--mh-primary-soft)] flex items-center justify-center text-[var(--mh-primary)]">
                        <i data-lucide="book-open" class="w-4.5 h-4.5"></i>
                    </div>
                    <span class="flex-1 text-[14px] font-medium text-[var(--mh-text)]">我的课程</span>
                    <span class="text-[12px] text-[var(--mh-text-muted)]">3 门进行中</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--mh-text-muted)]"></i>
                </button>
                <button class="menu-item w-full flex items-center gap-3 px-4 py-3.5 text-left">
                    <div class="w-9 h-9 rounded-[12px] bg-[var(--mh-secondary)]/12 flex items-center justify-center text-[var(--mh-secondary)]">
                        <i data-lucide="clipboard-list" class="w-4.5 h-4.5"></i>
                    </div>
                    <span class="flex-1 text-[14px] font-medium text-[var(--mh-text)]">我的测评</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--mh-text-muted)]"></i>
                </button>
                <button class="menu-item w-full flex items-center gap-3 px-4 py-3.5 text-left">
                    <div class="w-9 h-9 rounded-[12px] bg-[var(--mh-accent)]/18 flex items-center justify-center text-[var(--mh-accent-foreground)]">
                        <i data-lucide="trophy" class="w-4.5 h-4.5"></i>
                    </div>
                    <span class="flex-1 text-[14px] font-medium text-[var(--mh-text)]">成就中心</span>
                    <span class="text-[12px] text-[var(--mh-primary)] font-medium">3/12</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--mh-text-muted)]"></i>
                </button>
            </div>
        </section>

        <!-- Menu Group 3 - 设置与帮助 -->
        <section class="rise delay-6 px-6 pb-4 relative z-10">
            <p class="text-[12px] font-medium text-[var(--mh-text-muted)] mb-2.5 px-1">设置与帮助</p>
            <div class="menu-group rounded-[20px] overflow-hidden">
                <button class="menu-item w-full flex items-center gap-3 px-4 py-3.5 text-left">
                    <div class="w-9 h-9 rounded-[12px] bg-[var(--mh-surface-muted)] flex items-center justify-center text-[var(--mh-text-light)]">
                        <i data-lucide="settings" class="w-4.5 h-4.5"></i>
                    </div>
                    <span class="flex-1 text-[14px] font-medium text-[var(--mh-text)]">账号设置</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--mh-text-muted)]"></i>
                </button>
                <button class="menu-item w-full flex items-center gap-3 px-4 py-3.5 text-left">
                    <div class="w-9 h-9 rounded-[12px] bg-[var(--mh-surface-muted)] flex items-center justify-center text-[var(--mh-text-light)]">
                        <i data-lucide="bell" class="w-4.5 h-4.5"></i>
                    </div>
                    <span class="flex-1 text-[14px] font-medium text-[var(--mh-text)]">通知设置</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--mh-text-muted)]"></i>
                </button>
                <button class="menu-item w-full flex items-center gap-3 px-4 py-3.5 text-left">
                    <div class="w-9 h-9 rounded-[12px] bg-[var(--mh-surface-muted)] flex items-center justify-center text-[var(--mh-text-light)]">
                        <i data-lucide="help-circle" class="w-4.5 h-4.5"></i>
                    </div>
                    <span class="flex-1 text-[14px] font-medium text-[var(--mh-text)]">帮助与反馈</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--mh-text-muted)]"></i>
                </button>
                <button class="menu-item w-full flex items-center gap-3 px-4 py-3.5 text-left">
                    <div class="w-9 h-9 rounded-[12px] bg-[var(--mh-surface-muted)] flex items-center justify-center text-[var(--mh-text-light)]">
                        <i data-lucide="info" class="w-4.5 h-4.5"></i>
                    </div>
                    <span class="flex-1 text-[14px] font-medium text-[var(--mh-text)]">关于我们</span>
                    <span class="text-[12px] text-[var(--mh-text-muted)]">v 1.0.0</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--mh-text-muted)]"></i>
                </button>
            </div>
        </section>

        <!-- Logout -->
        <section class="rise delay-7 px-6 pt-2 pb-6 relative z-10">
            <button class="logout-btn w-full h-12 rounded-full bg-[var(--mh-surface-muted)] text-[var(--mh-text-light)] text-[14px] font-medium flex items-center justify-center gap-2 border border-[var(--mh-border)]">
                <i data-lucide="log-out" class="w-4 h-4"></i>
                退出登录
            </button>
        </section>

        <!-- Bottom Navigation -->
        <nav class="fixed bottom-5 left-1/2 -translate-x-1/2 z-40 w-[calc(100%-40px)] max-w-[400px]">
            <div class="nav-pill rounded-full h-[64px] px-2 flex items-center justify-between">
                <button class="flex flex-col items-center justify-center gap-1 w-12 h-12 rounded-full text-[var(--mh-text-light)] hover:text-[var(--mh-primary)] transition-colors">
                    <i data-lucide="home" class="w-5 h-5"></i>
                    <span class="text-[9px] font-medium">首页</span>
                </button>
                <button class="flex flex-col items-center justify-center gap-1 w-12 h-12 rounded-full text-[var(--mh-text-light)] hover:text-[var(--mh-primary)] transition-colors">
