<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 - 情绪健康平台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { overflow-x: hidden; }
  .wrap { padding: 22px 20px 0; }

  /* 横排子导航 */
  .hnav { display: flex; background: #f4f8f4; border-bottom: 1px solid #e7efe7; }
  .hnav a {
    flex: 0 0 auto; min-width: 130px;
    display: flex; flex-direction: row; align-items: center; justify-content: center;
    gap: 9px; padding: 15px 20px 13px; color: #7c8a7c; font-size: 17px; position: relative;
  }
  .hnav a .ic { font-size: 20px; line-height: 1; }
  .hnav a.active { color: var(--green-deep); font-weight: 700; }
  .hnav a.active::after {
    content: ''; position: absolute; bottom: 0; left: 20%; right: 20%;
    height: 3px; border-radius: 3px; background: var(--green-deep);
  }

  .my-title { font-size: 34px; margin: 22px 4px 20px; }

  /* 用户卡 */
  .user-card {
    background: #fff; border-radius: var(--r-lg); box-shadow: var(--sh-soft);
    padding: 34px 20px 36px; text-align: center; margin-bottom: 22px;
  }
  .avatar {
    width: 158px; height: 158px; margin: 0 auto 22px; border-radius: 50%;
    background: linear-gradient(150deg, #6f86e8 0%, #7b63d8 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 24px rgba(105,100,210,.3);
  }
  .avatar i { font-size: 86px; color: rgba(0,0,0,.28); }
  .user-card .uname { font-size: 34px; color: #2b2f38; margin-bottom: 10px; }
  .user-card .uid { font-size: 17px; color: var(--ink-mute); }

  /* 情绪主页卡 */
  .mood-card {
    background: #fff; border-radius: var(--r-lg); box-shadow: var(--sh-soft);
    padding: 26px 20px 30px; margin-bottom: 26px;
  }
  .mood-card > h2 { font-size: 25px; margin-bottom: 24px; }
  .score-row { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
  .score-circle {
    width: 178px; height: 178px; border-radius: 50%; flex-shrink: 0;
    background: radial-gradient(circle at 36% 30%, #4fb67c, #2f975c);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; box-shadow: 0 12px 26px rgba(47,151,92,.3);
  }
  .score-circle .n { font-size: 68px; font-weight: 800; line-height: 1; }
  .score-circle .t { font-size: 16px; margin-top: 8px; opacity: .95; }
  .score-desc { font-size: 15.5px; color: var(--ink-mute); line-height: 1.9; }

  .freq-title { font-size: 19px; font-weight: 700; margin-bottom: 16px; }
  .freq-list { display: flex; flex-wrap: wrap; gap: 14px 18px; }
  .freq {
    display: inline-flex; align-items: center; gap: 10px;
    background: #f1efea; border-radius: var(--r-pill); padding: 8px 10px 8px 20px;
  }
  .freq .m { font-size: 16px; color: var(--ink-soft); }
  .freq .c {
    background: #43b06f; color: #fff; font-size: 14px; font-weight: 700;
    border-radius: var(--r-pill); padding: 3px 12px;
  }

  /* 统计行 */
  .stat-box {
    background: #f6f4f0; border-radius: 14px; text-align: center;
    padding: 20px 0 18px; margin-top: 14px;
  }
  .stat-box .lab { font-size: 17px; color: var(--ink-soft); margin-bottom: 6px; }
  .stat-box .val { font-size: 40px; font-weight: 800; color: #3caf6c; line-height: 1.2; }

  /* 功能入口 */
  .entry-title { font-size: 26px; margin: 6px 4px 20px; }
  .entry-card {
    background: #fff; border-radius: var(--r-lg); box-shadow: var(--sh-soft);
    padding: 30px 24px 32px; margin-bottom: 26px;
  }
  .entry-card .gic { font-size: 58px; color: var(--purple); margin-bottom: 22px; }
  .entry-card h3 { font-family: var(--font-sans); font-size: 23px; font-weight: 700; margin-bottom: 10px; }
  .entry-card p { font-size: 16px; color: var(--ink-mute); }
</style>
</head>
<body>
<div class="phone">
  <nav class="hnav">
    <a class="active" href="#"><span class="ic"><i class="fa-solid fa-user"></i></span>个人资料</a>
    <a href="#"><span class="ic"><i class="fa-solid fa-gear"></i></span>设置</a>
  </nav>

  <div class="wrap">
    <h1 class="serif my-title">我的</h1>

    <div class="user-card">
      <div class="avatar"><i class="fa-solid fa-user"></i></div>
      <div class="uname serif">demo_student</div>
      <div class="uid">用户ID: 2</div>
    </div>

    <div class="mood-card">
      <h2 class="serif">个人情绪主页</h2>
      <div class="score-row">
        <div class="score-circle">
          <span class="n">54</span>
          <span class="t">情绪健康评分</span>
        </div>
        <p class="score-desc">基于近30天情绪记录<br>积极情绪占比越高，评分越高</p>
      </div>

      <div class="freq-title">近期高频情绪</div>
      <div class="freq-list">
        <span class="freq"><span class="m">焦虑</span><span class="c">2次</span></span>
        <span class="freq"><span class="m">平静</span><span class="c">2次</span></span>
        <span class="freq"><span class="m">快乐</span><span class="c">1次</span></span>
      </div>

      <div class="stat-box">
        <div class="lab">记录的情绪</div>
        <div class="val">0次</div>
      </div>
      <div class="stat-box">
        <div class="lab">收藏的知识点</div>
        <div class="val">0个</div>
      </div>
      <div class="stat-box">
        <div class="lab">收藏的解压工具</div>
        <div class="val">0个</div>
      </div>
    </div>

    <h2 class="serif entry-title">功能入口</h2>

    <div class="entry-card">
      <i class="fa-solid fa-gear gic"></i>
      <h3>设置</h3>
      <p>账号和隐私设置</p>
    </div>
  </div>

  <nav class="tabbar">
    <a class="tab-item" href="#"><span class="ic"><i class="fa-solid fa-house"></i></span><span>首页</span></a>
    <a class="tab-item" href="#"><span class="ic"><i class="fa-solid fa-face-smile"></i></span><span>情绪</span></a>
    <a class="tab-item" href="#"><span class="ic"><i class="fa-solid fa-leaf"></i></span><span>放松</span></a>
    <a class="tab-item" href="#"><span class="ic"><i class="fa-solid fa-chart-line"></i></span><span>提升</span></a>
    <a class="tab-item active" href="#"><span class="ic"><i class="fa-solid fa-ellipsis"></i></span><span>更多</span></a>
  </nav>
  <div class="copyright">© 2025 情绪健康平台 版权所有</div>
</div>
</body>
</html>
