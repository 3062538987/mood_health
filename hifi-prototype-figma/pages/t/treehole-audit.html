<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>树洞审核 · 管理后台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  .audit-title { text-align:center; font-family:var(--font-serif); font-size:28px; font-weight:700; margin:8px 0 26px; }
  .status-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin-bottom:26px; }
  .status-card {
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:24px 30px; display:flex; align-items:center; gap:18px;
  }
  .status-card .ico-pending { font-size:40px; color:#9b8fb5; }
  .status-card .ico-pass {
    width:42px; height:42px; border-radius:9px; background:var(--green-deep);
    color:#fff; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;
  }
  .status-card .ico-reject {
    width:42px; height:42px; border-radius:9px; background:#f06292;
    color:#fff; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;
  }
  .status-card .meta .lab { font-size:15px; color:var(--ink-soft); margin-bottom:4px; }
  .status-card .meta .num { font-size:30px; font-weight:800; color:var(--primary-deep); line-height:1.1; }
  .audit-tools { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .audit-tools select {
    border:1px solid var(--line-strong); border-radius:8px; background:#fff;
    padding:9px 14px; font-size:14px; color:var(--ink); font-family:inherit; min-width:110px;
  }
  .audit-tools .btn-refresh {
    border:1px solid var(--line-strong); background:#fff; border-radius:8px;
    padding:9px 20px; font-size:14px; color:var(--ink); display:inline-flex; align-items:center; gap:8px;
  }
  .audit-empty { text-align:center; padding:70px 0 60px; }
  .audit-empty .big { font-size:60px; color:#b7aca0; margin-bottom:18px; }
  .audit-empty .txt { color:var(--ink-mute); font-size:15px; }
  .audit-pager { display:flex; align-items:center; justify-content:center; gap:14px; font-size:14px; color:var(--ink-soft); }
  .audit-pager button {
    border:1px solid var(--line-strong); background:#fff; border-radius:8px;
    padding:9px 22px; font-size:14px; color:var(--ink-soft);
  }
  .audit-pager button:disabled { opacity:.45; }
</style>
</head>
<body>
<div class="desktop">

  <nav class="top-nav">
    <a href="#"><i class="fa-solid fa-house ic"></i>首页</a>
    <a href="#"><i class="fa-solid fa-face-smile ic"></i>情绪</a>
    <a href="#"><i class="fa-solid fa-leaf ic"></i>放松</a>
    <a href="#"><i class="fa-solid fa-chart-line ic"></i>提升</a>
    <a href="#"><i class="fa-solid fa-heart ic"></i>咨询</a>
    <a href="#"><i class="fa-solid fa-robot ic"></i>AI知识助手</a>
    <a href="#"><i class="fa-solid fa-user ic"></i>我的</a>
    <a href="#" class="active"><i class="fa-solid fa-users-gear ic"></i>管理后台</a>
    <span class="spacer"></span>
    <span class="user-name">demo_super_admin</span>
    <a href="#" class="logout"><i class="fa-solid fa-right-from-bracket"></i> 退出</a>
  </nav>

  <div class="crumb-bar">
    <div class="left"><i class="fa-solid fa-house ic"></i>树洞审核</div>
    <div class="right">
      <i class="fa-solid fa-circle-user" style="color:var(--primary)"></i>
      <span>demo_super_admin</span>
      <span class="role-tag">super_admin</span>
    </div>
  </div>

  <div class="admin-body">
    <aside class="sidebar">
      <div class="sidebar-head">
        <span><i class="fa-solid fa-users ic"></i> 管理后台</span>
        <i class="fa-solid fa-chevron-left collapse"></i>
      </div>
      <nav class="side-menu">
        <a href="dashboard.html"><i class="fa-solid fa-gauge-high ic"></i>管理首页</a>
        <a href="users.html"><i class="fa-solid fa-users-cog ic"></i>用户管理</a>
        <a href="user-moods.html"><i class="fa-solid fa-chart-line ic"></i>用户情绪数据</a>
        <a href="moods.html"><i class="fa-solid fa-face-smile ic"></i>情绪记录</a>

    </aside>

    <main class="admin-main">
      <h2 class="audit-title">树洞内容审核</h2>

      <div class="status-grid">
        <div class="status-card">
          <i class="fa-solid fa-clipboard ico-pending"></i>
          <div class="meta"><div class="lab">待审核</div><div class="num">0</div></div>
        </div>
        <div class="status-card">
          <span class="ico-pass"><i class="fa-solid fa-check"></i></span>
          <div class="meta"><div class="lab">已通过</div><div class="num">0</div></div>
        </div>
        <div class="status-card">
          <span class="ico-reject"><i class="fa-solid fa-xmark"></i></span>
          <div class="meta"><div class="lab">已拒绝</div><div class="num">0</div></div>
        </div>
      </div>

      <div class="audit-tools">
        <select><option>待审核</option><option>已通过</option><option>已拒绝</option></select>
        <button class="btn-refresh"><i class="fa-solid fa-rotate"></i> 刷新</button>
      </div>

      <div class="audit-empty">
        <div class="big"><i class="fa-solid fa-box-archive"></i></div>
        <div class="txt">暂无待审核内容</div>
      </div>

      <div class="audit-pager">
        <button disabled>上一页</button>
        <span>第 1 页</span>
        <button disabled>下一页</button>
      </div>
