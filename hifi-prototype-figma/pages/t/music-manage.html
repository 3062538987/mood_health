<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音乐管理 · 管理后台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  .desktop { position: relative; }
  .toast-stack {
    position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
    z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .toast {
    display: inline-flex; align-items: center; gap: 9px;
    background: var(--danger-soft); color: #c0394c;
    border: 1px solid #f4c3cc; border-radius: 10px;
    padding: 9px 26px; font-size: 14px;
    box-shadow: 0 6px 18px rgba(192, 57, 76, 0.14);
  }
  .toast i { color: var(--primary); }
  .refresh-v {
    width: 34px; height: 46px;
    border: 1px solid #cfc7bb; background: #f7f4ef;
    border-radius: 5px; font-size: 13px; color: #4a443d;
    writing-mode: vertical-rl; letter-spacing: 2px;
    display: inline-flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>
<div class="desktop">

  <!-- 错误提示 toast -->

  <!-- 顶部前台导航 -->

    <a href="#"><i class="fa-solid fa-robot ic"></i>AI知识助手</a>
    <a href="#"><i class="fa-solid fa-user ic"></i>我的</a>
    <a href="#" class="active"><i class="fa-solid fa-users-gear ic"></i>管理后台</a>
    <span class="spacer"></span>
    <span class="user-name">demo_super_admin</span>
    <a class="logout" href="#"><i class="fa-solid fa-right-from-bracket"></i> 退出</a>

  <!-- 面包屑条 -->

      <span>demo_super_admin</span>
      <span class="role-tag">super_admin</span>
    </div>
  </div>

  <div class="admin-body">

        <span><i class="fa-solid fa-users ic"></i> 管理后台</span>
        <i class="fa-solid fa-chevron-left collapse"></i>
      </div>
      <nav class="side-menu">
        <a href="dashboard.html"><i class="fa-solid fa-gauge-high ic"></i>管理首页</a>
        <a href="users.html"><i class="fa-solid fa-users-cog ic"></i>用户管理</a>

        <a href="moods.html"><i class="fa-solid fa-face-smile ic"></i>情绪记录</a>
