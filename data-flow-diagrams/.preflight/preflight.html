/* ============================================================
   Data Flow Diagrams — Design Tokens
   Theme: Technical / Documentation
   ============================================================ */

:root {
  /* Brand — Deep teal primary */
  --mood-primary: #0d9488;
  --mood-primary-foreground: #ffffff;

  /* Surfaces */
  --mood-background: #f8fafc;
  --mood-foreground: #0f172a;
  --mood-card: #ffffff;
  --mood-card-foreground: #0f172a;
  --mood-popover: #ffffff;
  --mood-popover-foreground: #0f172a;

  /* Muted */
  --mood-muted: #f1f5f9;
  --mood-muted-foreground: #64748b;

  /* Border & input */
  --mood-border: #e2e8f0;
  --mood-input: #e2e8f0;
  --mood-ring: #0d9488;

  /* Accent / Support hues */
  --mood-accent: #f0fdfa;
  --mood-accent-foreground: #0f766e;

  /* Secondary */
  --mood-secondary: #e0f2fe;
  --mood-secondary-foreground: #0369a1;

  /* State colors */
  --mood-success: #10b981;
  --mood-warning: #f59e0b;
  --mood-danger: #ef4444;
  --mood-info: #3b82f6;

  /* Radius */
  --mood-radius-sm: 6px;
  --mood-radius-md: 10px;
  --mood-radius-lg: 16px;

  /* Typography */
  --mood-font-sans: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
  --mood-font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
}

@theme inline {
  --color-primary: var(--mood-primary);
  --color-primary-foreground: var(--mood-primary-foreground);
  --color-background: var(--mood-background);
  --color-foreground: var(--mood-foreground);
  --color-card: var(--mood-card);
  --color-card-foreground: var(--mood-card-foreground);
  --color-popover: var(--mood-popover);
  --color-popover-foreground: var(--mood-popover-foreground);
  --color-muted: var(--mood-muted);
  --color-muted-foreground: var(--mood-muted-foreground);
  --color-border: var(--mood-border);
  --color-input: var(--mood-input);
  --color-ring: var(--mood-ring);
  --color-accent: var(--mood-accent);
  --color-accent-foreground: var(--mood-accent-foreground);
  --color-secondary: var(--mood-secondary);
  --color-secondary-foreground: var(--mood-secondary-foreground);
  --color-success: var(--mood-success);
  --color-warning: var(--mood-warning);
  --color-danger: var(--mood-danger);
  --color-info: var(--mood-info);
  --radius-sm: var(--mood-radius-sm);
  --radius-md: var(--mood-radius-md);
  --radius-lg: var(--mood-radius-lg);
  --font-sans: var(--mood-font-sans);
  --font-mono: var(--mood-font-mono);
}

    </style>
