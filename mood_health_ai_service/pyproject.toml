[project]
name = "mood-health-ai-service"
version = "0.1.0"
description = "AI mood analysis microservice for mood_health platform"
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.10.0",
    "httpx>=0.28.0",
    "openai>=1.55.0",
    "langgraph==1.2.9",
    "langchain-openai==1.4.0",
    "langchain-tavily==0.2.18",
    "mysql-connector-python>=9.0.0",
    "redis[hiredis]>=5.2.0",
    "typing-extensions>=4.12.0",
    "python-dotenv>=1.0.0",
    "chromadb==1.5.9",
    "sentence-transformers>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/models/contracts.py" = ["N815"]
"app/rag/knowledge_base.py" = ["E501"]
"tests/contract/test_mood_analysis_contract.py" = ["N802"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openai", "openai.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
