name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'codex/**'

jobs:
  build-test-audit:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mood_health_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret-for-tests-only
      JWT_REFRESH_SECRET: ci-refresh-secret-for-tests-only
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: mood_health_test
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_MIGRATOR_USER: root
      MYSQL_MIGRATOR_PASSWORD: root
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      AI_MOCK_MODE: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: mood_health_server

      - name: Build and test
        run: npm run verify:all

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Audit backend dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
        working-directory: mood_health_server
