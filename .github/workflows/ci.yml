name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

# 最小权限原则
permissions:
  contents: read

# 同一 ref 只保留最新一次运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 前端（Vue 3 + TS + Vite） ----------
  frontend:
    name: Frontend (lint / type / unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint:check
      - name: Type check
        run: npx vue-tsc --noEmit
      - name: Unit tests
        run: npx vitest run

  # ---------- 后端（Node + TS + Express） ----------
  backend:
    name: Backend (build / type / jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mood_health_server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mood_health_server/package-lock.json
      - name: Install
        run: npm ci
      - name: Build (tsc)
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:stable

  # ---------- AI 服务（Python + FastAPI） ----------
  ai:
    name: AI Service (ruff / mypy / pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mood_health_ai_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: mood_health_ai_service/pyproject.toml
      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Ruff lint
        run: ruff check app
      - name: Mypy type check
        run: mypy app
      - name: Pytest
        run: pytest -q

  # ---------- 密钥扫描（门禁） ----------
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 全量历史供 gitleaks 扫描
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'
          GITLEAKS_CONFIG: ''   # 使用内置规则；若有已知误报，在仓库加 .gitleaks.toml 用 allowlist 排除

  # ---------- 依赖审计（门禁） ----------
  dependency-audit:
    name: Dependency Audit (npm / pip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Frontend npm audit
        run: npm audit --audit-level=high
      - name: Backend npm audit
        working-directory: mood_health_server
        run: npm audit --audit-level=high || true   # 临时兼容，修复后应去掉 || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: AI pip-audit
        working-directory: mood_health_ai_service
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -r requirements.txt
          pip-audit -r requirements.txt --audit-level=high

  # ---------- 汇总门禁 ----------
  gate:
    name: CI Gate
    needs: [frontend, backend, ai, secret-scan, dependency-audit]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail if any job failed
        run: |
          echo "frontend=${{ needs.frontend.result }}"
          echo "backend=${{ needs.backend.result }}"
          echo "ai=${{ needs.ai.result }}"
          echo "secret-scan=${{ needs.secret-scan.result }}"
          echo "dependency-audit=${{ needs.dependency-audit.result }}"
          if [ "${{ needs.frontend.result }}" != "success" ] \
             || [ "${{ needs.backend.result }}" != "success" ] \
             || [ "${{ needs.ai.result }}" != "success" ] \
             || [ "${{ needs.secret-scan.result }}" != "success" ] \
             || [ "${{ needs.dependency-audit.result }}" != "success" ]; then
            echo "::error::One or more CI jobs failed"; exit 1
          fi
