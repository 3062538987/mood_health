# Nginx 反向代理配置 — Mood Health 三服务 (Node + FastAPI + 前端静态文件)
# 部署: 复制到 /etc/nginx/sites-available/mood-health 并 ln -s 到 sites-enabled

upstream node_backend {
    server 127.0.0.1:3000;
}

upstream fastapi_ai {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    server_name localhost;

    # 日志（不记录健康检查）
    access_log /var/log/nginx/mood-health-access.log;
    error_log /var/log/nginx/mood-health-error.log;

    # 客户端请求体大小限制
    client_max_body_size 10m;

    # ---- 前端静态文件 ----
    location / {
        root /var/www/mood-health/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # ---- Node 后端 API ----
    location /api/ {
        # 健康检查特殊处理（不记录日志）
        location /api/health {
            proxy_pass http://node_backend;
            access_log off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        proxy_pass http://node_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ---- FastAPI AI 服务（仅内部调用，不对外暴露） ----
    # 如需对外暴露 AI 端点，取消下面注释:
    # location /api/analyze/ {
    #     proxy_pass http://fastapi_ai;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_connect_timeout 60s;
    #     proxy_read_timeout 120s;
    # }

    # ---- 健康检查端点 ----
    # 三服务健康状态聚合
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","services":["node","fastapi","frontend"]}';
    }

    # ---- 安全头 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}