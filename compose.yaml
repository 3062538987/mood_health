name: mood-health

services:
  mysql:
    image: mysql:8.4.10
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mood_health}
      MYSQL_USER: ${MYSQL_APP_USER:-mood_app}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}
      TZ: UTC
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    entrypoint:
      - sh
      - -c
      - |
        cp /tmp/mood-health.cnf /etc/mysql/conf.d/mood-health.cnf
        chmod 0644 /etc/mysql/conf.d/mood-health.cnf
        exec /usr/local/bin/docker-entrypoint.sh mysqld
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/tmp/mood-health.cnf:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping --host=127.0.0.1 --user=root --password=$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    cpus: 1.0
    mem_limit: 768m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: UTC
    command:
      - sh
      - -c
      - exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$${REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli --no-auth-warning ping | grep PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    cpus: 0.5
    mem_limit: 256m

volumes:
  mysql_data:
  redis_data:
