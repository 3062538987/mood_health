    <style id="theme-vars">
/* ============================================
   日落花园 · 暖光治愈 — 情绪健康平台主题
   ============================================ */

:root {
  /* Brand prefix: mh (mood health) */
  --mh-primary: #e8834a;
  --mh-primary-foreground: #ffffff;
  --mh-primary-light: #f5c5a3;
  --mh-primary-hover: #d4723a;
  --mh-primary-soft: #fdf0e6;

  --mh-secondary: #8aab7c;
  --mh-secondary-foreground: #ffffff;
  --mh-secondary-light: #b8d0a8;
  --mh-secondary-hover: #7a9b6c;

  --mh-accent: #f0b860;
  --mh-accent-foreground: #4a3f38;
  --mh-accent-light: #f8d898;
  --mh-accent-hover: #e0a848;

  /* Background & Surface */
  --mh-background: #fef8f2;
  --mh-foreground: #4a3f38;
  --mh-warm: #fdf2e8;
  --mh-card: #fffdf9;
  --mh-card-foreground: #4a3f38;
  --mh-popover: #fffdf9;
  --mh-popover-foreground: #4a3f38;
  --mh-surface-muted: #faf5ee;

  /* Text */
  --mh-text: #4a3f38;
  --mh-text-light: #8c8078;
  --mh-text-muted: #b0a69c;
  --mh-muted: #faf5ee;
  --mh-muted-foreground: #8c8078;

  /* Border & Input */
  --mh-border: #e8ddd0;
  --mh-input: #e8ddd0;
  --mh-ring: #e8834a;

  /* Radius */
  --mh-radius-sm: 6px;
  --mh-radius-md: 10px;
  --mh-radius-lg: 16px;
  --mh-radius-xl: 24px;
  --mh-radius-full: 9999px;

  /* Status Colors */
  --mh-success: #7cb89a;
  --mh-success-foreground: #ffffff;
  --mh-warning: #f0b860;
  --mh-warning-foreground: #4a3f38;
  --mh-error: #e0556a;
  --mh-error-foreground: #ffffff;
  --mh-info: #7ba5c4;
  --mh-info-foreground: #ffffff;

  /* Risk Levels */
  --mh-risk-low: #8aab7c;
  --mh-risk-low-soft: rgba(138, 171, 124, 0.12);
  --mh-risk-medium: #d2a35f;
  --mh-risk-medium-soft: rgba(210, 163, 95, 0.12);
  --mh-risk-high: #cf6b7f;
  --mh-risk-high-soft: rgba(207, 107, 127, 0.12);

  /* Mental States */
  --mh-mental-calm: #8aab7c;
  --mh-mental-neutral: #b0a69c;
  --mh-mental-anxious: #c090d0;
  --mh-mental-stressed: #d2a35f;
  --mh-mental-distressed: #cf6b7f;

  /* Mood Colors */
  --mh-mood-happy: #f0b860;
  --mh-mood-sad: #7ba5c4;
  --mh-mood-angry: #e0556a;
  --mh-mood-anxious: #c090d0;
  --mh-mood-calm: #8aab7c;
  --mh-mood-neutral: #b0a69c;

  /* Shadow */
  --mh-shadow-sm: 0 2px 8px rgba(180, 140, 100, 0.08);
  --mh-shadow-md: 0 4px 16px rgba(180, 140, 100, 0.10);
  --mh-shadow-lg: 0 8px 32px rgba(180, 140, 100, 0.14);
  --mh-shadow-glow: 0 0 40px rgba(240, 184, 96, 0.12);

  /* Typography */
  --mh-font-display: 'Noto Serif SC', 'Georgia', 'Songti SC', serif;
  --mh-font-body: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;

  /* Semantic aliases for Tailwind compatibility */
  --background: var(--mh-background);
  --foreground: var(--mh-foreground);
  --card: var(--mh-card);
  --card-foreground: var(--mh-card-foreground);
  --popover: var(--mh-popover);
  --popover-foreground: var(--mh-popover-foreground);
  --primary: var(--mh-primary);
  --primary-foreground: var(--mh-primary-foreground);
  --secondary: var(--mh-secondary);
  --secondary-foreground: var(--mh-secondary-foreground);
  --accent: var(--mh-accent);
  --accent-foreground: var(--mh-accent-foreground);
  --muted: var(--mh-muted);
  --muted-foreground: var(--mh-muted-foreground);
  --destructive: var(--mh-error);
  --destructive-foreground: var(--mh-error-foreground);
  --border: var(--mh-border);
  --input: var(--mh-input);
  --ring: var(--mh-ring);
  --radius: var(--mh-radius-lg);
  --radius-sm: var(--mh-radius-sm);
  --radius-md: var(--mh-radius-md);
  --radius-lg: var(--mh-radius-lg);
  --radius-xl: var(--mh-radius-xl);
  --radius-full: var(--mh-radius-full);
}

/* Dark mode */
@media (prefers-color-scheme: dark) {
  :root {
    --mh-background: #1e1b18;
    --mh-foreground: #e8ddd0;
    --mh-warm: #25211d;
    --mh-card: #2a2520;
    --mh-card-foreground: #e8ddd0;
    --mh-popover: #2a2520;
    --mh-popover-foreground: #e8ddd0;
    --mh-surface-muted: #2f2a24;
    --mh-text: #e8ddd0;
    --mh-text-light: #b0a69c;
    --mh-text-muted: #8c8078;
    --mh-muted: #2f2a24;
    --mh-muted-foreground: #b0a69c;
    --mh-border: #3d3630;
    --mh-input: #3d3630;
    --mh-primary: #f0a070;
    --mh-primary-hover: #f5b890;
    --mh-primary-soft: rgba(240, 160, 112, 0.12);
    --mh-secondary: #a8c898;
    --mh-accent: #f8c878;
    --mh-ring: #f5b890;

    --background: var(--mh-background);
    --foreground: var(--mh-foreground);
    --card: var(--mh-card);
    --card-foreground: var(--mh-card-foreground);
    --popover: var(--mh-popover);
    --popover-foreground: var(--mh-popover-foreground);
    --primary: var(--mh-primary);
    --secondary: var(--mh-secondary);
    --accent: var(--mh-accent);
    --muted: var(--mh-muted);
    --muted-foreground: var(--mh-muted-foreground);
    --destructive: var(--mh-error);
    --border: var(--mh-border);
    --input: var(--mh-input);
    --ring: var(--mh-ring);
  }
}

/* Base styles */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  font-family: var(--mh-font-body);
  background: var(--mh-background);
  color: var(--mh-text);
  line-height: 1.6;
  min-height: 100vh;
}

h1, h2, h3, h4, h5, h6 {
  font-family: var(--mh-font-display);
  font-weight: 600;
  line-height: 1.3;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
}

img {
  max-width: 100%;
  display: block;
}

                        <!-- Card 2: 睡前冥想 -->
                        <button data-dom-id="quick-relax" class="w-full flex items-center gap-3 p-3 rounded-xl bg-[var(--mh-card)] border border-[var(--mh-border)]/60 text-left hover:border-[var(--mh-secondary)]/30 hover:shadow-[0_2px_12px_rgba(138,171,124,0.08)] active:scale-[0.98] transition-all">
                            <div class="shrink-0 w-10 h-10 rounded-lg flex items-center justify-center" style="background: linear-gradient(135deg, var(--mh-risk-low-soft) 0%, rgba(138,171,124,0.08) 100%);">
                                <i data-lucide="moon" class="w-5 h-5 text-[var(--mh-secondary)]"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="text-[13.5px] font-medium text-[var(--mh-text)] truncate">睡前冥想</div>
                                <div class="text-[11.5px] text-[var(--mh-text-light)] truncate">10 分钟 · 改善睡眠</div>
                            </div>
                            <i data-lucide="play-circle" class="w-5 h-5 text-[var(--mh-secondary)] shrink-0"></i>
                        </button>
                        <!-- Card 3: 情绪日记 -->
                        <button data-dom-id="quick-suggestions" class="w-full flex items-center gap-3 p-3 rounded-xl bg-[var(--mh-card)] border border-[var(--mh-border)]/60 text-left hover:border-[var(--mh-accent)]/30 hover:shadow-[0_2px_12px_rgba(240,184,96,0.08)] active:scale-[0.98] transition-all">
                            <div class="shrink-0 w-10 h-10 rounded-lg flex items-center justify-center" style="background: linear-gradient(135deg, var(--mh-accent-light)/40 0%, var(--mh-primary-soft) 100%);">
                                <i data-lucide="book-open" class="w-5 h-5 text-[var(--mh-accent-foreground)]/80"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="text-[13.5px] font-medium text-[var(--mh-text)] truncate">情绪日记</div>
                                <div class="text-[11.5px] text-[var(--mh-text-light)] truncate">记录心情 · 梳理思绪</div>
                            </div>
                            <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--mh-text-muted)] shrink-0"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Quick reply chips -->
            <div class="flex flex-wrap gap-2 pt-2 pl-10">
                <button class="px-3.5 py-1.5 rounded-full border border-[var(--mh-border)] bg-[var(--mh-card)] text-[12.5px] text-[var(--mh-text-light)] hover:border-[var(--mh-primary)]/40 hover:text-[var(--mh-primary)] hover:bg-[var(--mh-primary-soft)]/30 active:scale-95 transition-all whitespace-nowrap">
                    我想聊聊情绪
                </button>
                <button class="px-3.5 py-1.5 rounded-full border border-[var(--mh-border)] bg-[var(--mh-card)] text-[12.5px] text-[var(--mh-text-light)] hover:border-[var(--mh-primary)]/40 hover:text-[var(--mh-primary)] hover:bg-[var(--mh-primary-soft)]/30 active:scale-95 transition-all whitespace-nowrap">
                    给我一些建议
                </button>
                <button class="px-3.5 py-1.5 rounded-full border border-[var(--mh-border)] bg-[var(--mh-card)] text-[12.5px] text-[var(--mh-text-light)] hover:border-[var(--mh-primary)]/40 hover:text-[var(--mh-primary)] hover:bg-[var(--mh-primary-soft)]/30 active:scale-95 transition-all whitespace-nowrap">
                    帮我放松一下
                </button>
                <button class="px-3.5 py-1.5 rounded-full border border-[var(--mh-border)] bg-[var(--mh-card)] text-[12.5px] text-[var(--mh-text-light)] hover:border-[var(--mh-primary)]/40 hover:text-[var(--mh-primary)] hover:bg-[var(--mh-primary-soft)]/30 active:scale-95 transition-all whitespace-nowrap">
                    继续说
                </button>
            </div>

            <!-- Bottom spacer for input area -->
            <div class="h-24"></div>
        </div>

        <!-- Input area (sticky bottom) -->
        <div class="sticky bottom-0 left-0 right-0 px-4 py-3 bg-[var(--mh-card)]/90 backdrop-blur-md border-t border-[var(--mh-border)]/60">
            <div class="flex items-end gap-2.5">
                <button class="shrink-0 flex items-center justify-center w-9 h-9 rounded-lg text-[var(--mh-text-light)] hover:bg-[var(--mh-muted)] hover:text-[var(--mh-text)] transition-colors" aria-label="添加">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                </button>
                <div class="flex-1 relative">
                    <textarea
                        rows="1"
                        placeholder="想说点什么..."
                        class="w-full max-h-28 px-4 py-2.5 rounded-xl bg-[var(--mh-muted)] text-[14px] text-[var(--mh-text)] placeholder:text-[var(--mh-text-muted)] resize-none outline-none focus:ring-2 focus:ring-[var(--mh-primary)]/20 border border-transparent focus:border-[var(--mh-primary)]/30 transition-all"
                    ></textarea>
                </div>
                <button data-dom-id="btn-send-message" class="shrink-0 flex items-center justify-center w-10 h-10 rounded-full text-white shadow-[0_4px_12px_rgba(232,131,74,0.25)] hover:shadow-[0_6px_16px_rgba(232,131,74,0.32)] active:scale-90 transition-all" style="background: linear-gradient(135deg, var(--mh-primary) 0%, var(--mh-accent) 100%);" aria-label="发送">
                    <i data-lucide="send" class="w-4.5 h-4.5 -ml-0.5"></i>
                </button>
            </div>
            <!-- Safe area spacer -->
            <div class="h-[env(safe-area-inset-bottom,8px)]"></div>
        </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
