/* ============================================
   日落花园 · 暖光治愈 — 情绪健康平台主题
   ============================================ */

:root {
  /* Brand prefix: mh (mood health) */
  --mh-primary: #e8834a;
  --mh-primary-foreground: #ffffff;
  --mh-primary-light: #f5c5a3;
  --mh-primary-hover: #d4723a;
  --mh-primary-soft: #fdf0e6;

  --mh-secondary: #8aab7c;
  --mh-secondary-foreground: #ffffff;
  --mh-secondary-light: #b8d0a8;
  --mh-secondary-hover: #7a9b6c;

  --mh-accent: #f0b860;
  --mh-accent-foreground: #4a3f38;
  --mh-accent-light: #f8d898;
  --mh-accent-hover: #e0a848;

  /* Background & Surface */
  --mh-background: #fef8f2;
  --mh-foreground: #4a3f38;
  --mh-warm: #fdf2e8;
  --mh-card: #fffdf9;
  --mh-card-foreground: #4a3f38;
  --mh-popover: #fffdf9;
  --mh-popover-foreground: #4a3f38;
  --mh-surface-muted: #faf5ee;

  /* Text */
  --mh-text: #4a3f38;
  --mh-text-light: #8c8078;
  --mh-text-muted: #b0a69c;
  --mh-muted: #faf5ee;
  --mh-muted-foreground: #8c8078;

  /* Border & Input */
  --mh-border: #e8ddd0;
  --mh-input: #e8ddd0;
  --mh-ring: #e8834a;

  /* Radius */
  --mh-radius-sm: 6px;
  --mh-radius-md: 10px;
  --mh-radius-lg: 16px;
  --mh-radius-xl: 24px;
  --mh-radius-full: 9999px;

  /* Status Colors */
  --mh-success: #7cb89a;
  --mh-success-foreground: #ffffff;
  --mh-warning: #f0b860;
  --mh-warning-foreground: #4a3f38;
  --mh-error: #e0556a;
  --mh-error-foreground: #ffffff;
  --mh-info: #7ba5c4;
  --mh-info-foreground: #ffffff;

  /* Risk Levels */
  --mh-risk-low: #8aab7c;
  --mh-risk-low-soft: rgba(138, 171, 124, 0.12);
  --mh-risk-medium: #d2a35f;
  --mh-risk-medium-soft: rgba(210, 163, 95, 0.12);
  --mh-risk-high: #cf6b7f;
  --mh-risk-high-soft: rgba(207, 107, 127, 0.12);

  /* Mental States */
  --mh-mental-calm: #8aab7c;
  --mh-mental-neutral: #b0a69c;
  --mh-mental-anxious: #c090d0;
  --mh-mental-stressed: #d2a35f;
  --mh-mental-distressed: #cf6b7f;

  /* Mood Colors */
  --mh-mood-happy: #f0b860;
  --mh-mood-sad: #7ba5c4;
  --mh-mood-angry: #e0556a;
  --mh-mood-anxious: #c090d0;
  --mh-mood-calm: #8aab7c;
  --mh-mood-neutral: #b0a69c;

  /* Shadow */
  --mh-shadow-sm: 0 2px 8px rgba(180, 140, 100, 0.08);
  --mh-shadow-md: 0 4px 16px rgba(180, 140, 100, 0.10);
  --mh-shadow-lg: 0 8px 32px rgba(180, 140, 100, 0.14);
  --mh-shadow-glow: 0 0 40px rgba(240, 184, 96, 0.12);

  /* Typography */
  --mh-font-display: 'Noto Serif SC', 'Georgia', 'Songti SC', serif;
  --mh-font-body: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;

  /* Semantic aliases for Tailwind compatibility */
  --background: var(--mh-background);
  --foreground: var(--mh-foreground);
  --card: var(--mh-card);
  --card-foreground: var(--mh-card-foreground);
  --popover: var(--mh-popover);
  --popover-foreground: var(--mh-popover-foreground);
  --primary: var(--mh-primary);
  --primary-foreground: var(--mh-primary-foreground);
  --secondary: var(--mh-secondary);
  --secondary-foreground: var(--mh-secondary-foreground);
  --accent: var(--mh-accent);
  --accent-foreground: var(--mh-accent-foreground);
  --muted: var(--mh-muted);
  --muted-foreground: var(--mh-muted-foreground);
  --destructive: var(--mh-error);
  --destructive-foreground: var(--mh-error-foreground);
  --border: var(--mh-border);
  --input: var(--mh-input);
  --ring: var(--mh-ring);
  --radius: var(--mh-radius-lg);
  --radius-sm: var(--mh-radius-sm);
  --radius-md: var(--mh-radius-md);
  --radius-lg: var(--mh-radius-lg);
  --radius-xl: var(--mh-radius-xl);
  --radius-full: var(--mh-radius-full);
}

/* Dark mode */
@media (prefers-color-scheme: dark) {
  :root {
    --mh-background: #1e1b18;
    --mh-foreground: #e8ddd0;
    --mh-warm: #25211d;
    --mh-card: #2a2520;
    --mh-card-foreground: #e8ddd0;
    --mh-popover: #2a2520;
    --mh-popover-foreground: #e8ddd0;
    --mh-surface-muted: #2f2a24;
    --mh-text: #e8ddd0;
    --mh-text-light: #b0a69c;
    --mh-text-muted: #8c8078;
    --mh-muted: #2f2a24;
    --mh-muted-foreground: #b0a69c;
    --mh-border: #3d3630;
    --mh-input: #3d3630;
    --mh-primary: #f0a070;
    --mh-primary-hover: #f5b890;
    --mh-primary-soft: rgba(240, 160, 112, 0.12);
    --mh-secondary: #a8c898;
    --mh-accent: #f8c878;
    --mh-ring: #f5b890;

    --background: var(--mh-background);
    --foreground: var(--mh-foreground);
    --card: var(--mh-card);
    --card-foreground: var(--mh-card-foreground);
    --popover: var(--mh-popover);
    --popover-foreground: var(--mh-popover-foreground);
    --primary: var(--mh-primary);
    --secondary: var(--mh-secondary);
    --accent: var(--mh-accent);
    --muted: var(--mh-muted);
    --muted-foreground: var(--mh-muted-foreground);
    --destructive: var(--mh-error);
    --border: var(--mh-border);
    --input: var(--mh-input);
    --ring: var(--mh-ring);
  }
}

/* Base styles */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  font-family: var(--mh-font-body);
  background: var(--mh-background);
  color: var(--mh-text);
  line-height: 1.6;
  min-height: 100vh;
}

h1, h2, h3, h4, h5, h6 {
  font-family: var(--mh-font-display);
  font-weight: 600;
  line-height: 1.3;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
}

img {
  max-width: 100%;
  display: block;
}

                <i data-lucide="book-open" class="w-5 h-5"></i>
              </div>
              <h3 class="text-[15px] font-semibold text-[var(--mh-text)] mb-0.5" style="font-family: var(--mh-font-display);">睡前故事</h3>
              <p class="text-[11px] text-[var(--mh-text-light)]">温柔陪伴，安然入眠</p>
            </div>
          </button>
        </div>
      </section>

      <!-- Music Therapy Section -->
      <section class="pb-5">
        <div class="flex items-center justify-between px-5 mb-3">
          <h2 class="text-[17px] font-semibold text-[var(--mh-text)]" style="font-family: var(--mh-font-display);">音乐疗愈</h2>
          <button class="text-[12px] text-[var(--mh-text-light)] flex items-center gap-0.5">
            <span>更多</span>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          </button>
        </div>
        <div class="flex gap-3 overflow-x-auto no-scrollbar px-5 pb-1">
          <!-- Music Card 1 -->
          <div class="flex-shrink-0 w-36">
            <div class="relative w-36 h-36 rounded-2xl overflow-hidden mb-2.5 shadow-[var(--mh-shadow-sm)]">
              <img src="../assets/relax-zen-garden.jpg" alt="日落钢琴曲" class="w-full h-full object-cover" />
              <div class="absolute inset-0 bg-gradient-to-t from-[rgba(74,63,56,0.4)] to-transparent"></div>
              <button class="absolute bottom-2.5 right-2.5 w-8 h-8 rounded-full bg-white/90 backdrop-blur-sm flex items-center justify-center text-[var(--mh-primary)] shadow-md transition-transform active:scale-90">
                <i data-lucide="play" class="w-4 h-4 fill-current ml-0.5"></i>
              </button>
            </div>
            <h3 class="text-[13px] font-medium text-[var(--mh-text)] truncate">日落钢琴曲</h3>
            <p class="text-[11px] text-[var(--mh-text-muted)] mt-0.5">3:42</p>
          </div>
          <!-- Music Card 2 -->
          <div class="flex-shrink-0 w-36">
            <div class="relative w-36 h-36 rounded-2xl overflow-hidden mb-2.5 shadow-[var(--mh-shadow-sm)]">
              <div class="w-full h-full" style="background: linear-gradient(135deg, var(--mh-secondary-light) 0%, var(--mh-secondary) 100%);"></div>
              <div class="absolute inset-0 flex items-center justify-center">
                <i data-lucide="cloud-rain" class="w-12 h-12 text-white/50"></i>
              </div>
              <button class="absolute bottom-2.5 right-2.5 w-8 h-8 rounded-full bg-white/90 backdrop-blur-sm flex items-center justify-center text-[var(--mh-secondary)] shadow-md transition-transform active:scale-90">
                <i data-lucide="play" class="w-4 h-4 fill-current ml-0.5"></i>
              </button>
            </div>
            <h3 class="text-[13px] font-medium text-[var(--mh-text)] truncate">雨声森林</h3>
            <p class="text-[11px] text-[var(--mh-text-muted)] mt-0.5">5:18</p>
          </div>
          <!-- Music Card 3 -->
          <div class="flex-shrink-0 w-36">
            <div class="relative w-36 h-36 rounded-2xl overflow-hidden mb-2.5 shadow-[var(--mh-shadow-sm)]">
              <div class="w-full h-full" style="background: linear-gradient(135deg, var(--mh-accent-light) 0%, var(--mh-accent) 100%);"></div>
              <div class="absolute inset-0 flex items-center justify-center">
                <i data-lucide="sun" class="w-12 h-12 text-white/40"></i>
              </div>
              <button class="absolute bottom-2.5 right-2.5 w-8 h-8 rounded-full bg-white/90 backdrop-blur-sm flex items-center justify-center text-[var(--mh-accent-foreground)] shadow-md transition-transform active:scale-90">
                <i data-lucide="play" class="w-4 h-4 fill-current ml-0.5"></i>
              </button>
            </div>
            <h3 class="text-[13px] font-medium text-[var(--mh-text)] truncate">晨曦鸟鸣</h3>
            <p class="text-[11px] text-[var(--mh-text-muted)] mt-0.5">4:26</p>
          </div>
          <!-- Music Card 4 -->
          <div class="flex-shrink-0 w-36">
            <div class="relative w-36 h-36 rounded-2xl overflow-hidden mb-2.5 shadow-[var(--mh-shadow-sm)]">
              <div class="w-full h-full" style="background: linear-gradient(135deg, var(--mh-primary-light) 0%, var(--mh-primary) 100%);"></div>
              <div class="absolute inset-0 flex items-center justify-center">
                <i data-lucide="guitar" class="w-12 h-12 text-white/40"></i>
              </div>
              <button class="absolute bottom-2.5 right-2.5 w-8 h-8 rounded-full bg-white/90 backdrop-blur-sm flex items-center justify-center text-[var(--mh-primary)] shadow-md transition-transform active:scale-90">
                <i data-lucide="play" class="w-4 h-4 fill-current ml-0.5"></i>
              </button>
            </div>
            <h3 class="text-[13px] font-medium text-[var(--mh-text)] truncate">木吉他轻弹</h3>
            <p class="text-[11px] text-[var(--mh-text-muted)] mt-0.5">6:05</p>
          </div>
        </div>
      </section>

      <!-- Mini Games Section -->
      <section class="px-5 pb-5">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-[17px] font-semibold text-[var(--mh-text)]" style="font-family: var(--mh-font-display);">趣味放松</h2>
          <button class="text-[12px] text-[var(--mh-text-light)] flex items-center gap-0.5">
            <span>更多</span>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          </button>
        </div>
        <div class="space-y-3">
          <!-- Game 1: Wooden Fish -->
          <div class="rounded-2xl bg-[var(--mh-card)] p-4 shadow-[var(--mh-shadow-sm)] flex items-center gap-4 transition-transform active:scale-[0.99]">
            <div class="flex-shrink-0 w-14 h-14 rounded-2xl flex items-center justify-center" style="background: linear-gradient(135deg, var(--mh-accent-light) 0%, var(--mh-accent) 100%);">
              <i data-lucide="drum" class="w-7 h-7 text-white"></i>
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="text-[15px] font-semibold text-[var(--mh-text)] truncate" style="font-family: var(--mh-font-display);">木鱼</h3>
              <p class="text-[12px] text-[var(--mh-text-light)] mt-0.5 line-clamp-1">轻敲木鱼，在节奏中释放压力</p>
            </div>
            <button class="flex-shrink-0 w-9 h-9 rounded-full bg-[var(--mh-muted)] flex items-center justify-center text-[var(--mh-text-light)] transition-colors hover:bg-[var(--mh-border)]">
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
          <!-- Game 2: Tetris -->
          <div class="rounded-2xl bg-[var(--mh-card)] p-4 shadow-[var(--mh-shadow-sm)] flex items-center gap-4 transition-transform active:scale-[0.99]">
            <div class="flex-shrink-0 w-14 h-14 rounded-2xl flex items-center justify-center" style="background: linear-gradient(135deg, var(--mh-secondary-light) 0%, var(--mh-secondary) 100%);">
              <i data-lucide="grid-3x3" class="w-7 h-7 text-white"></i>
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="text-[15px] font-semibold text-[var(--mh-text)] truncate" style="font-family: var(--mh-font-display);">俄罗斯方块</h3>
              <p class="text-[12px] text-[var(--mh-text-light)] mt-0.5 line-clamp-1">经典休闲游戏，轻松打发碎片时间</p>
            </div>
            <button class="flex-shrink-0 w-9 h-9 rounded-full bg-[var(--mh-muted)] flex items-center justify-center text-[var(--mh-text-light)] transition-colors hover:bg-[var(--mh-border)]">
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
          <!-- Game 3: Pinball -->
          <div class="rounded-2xl bg-[var(--mh-card)] p-4 shadow-[var(--mh-shadow-sm)] flex items-center gap-4 transition-transform active:scale-[0.99]">
            <div class="flex-shrink-0 w-14 h-14 rounded-2xl flex items-center justify-center" style="background: linear-gradient(135deg, var(--mh-primary-light) 0%, var(--mh-primary) 100%);">
              <i data-lucide="target" class="w-7 h-7 text-white"></i>
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="text-[15px] font-semibold text-[var(--mh-text)] truncate" style="font-family: var(--mh-font-display);">弹珠台</h3>
              <p class="text-[12px] text-[var(--mh-text-light)] mt-0.5 line-clamp-1">指尖弹射，享受简单的快乐</p>
            </div>
            <button class="flex-shrink-0 w-9 h-9 rounded-full bg-[var(--mh-muted)] flex items-center justify-center text-[var(--mh-text-light)] transition-colors hover:bg-[var(--mh-border)]">
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      </section>

      <!-- Sleep Section -->
      <section class="px-5 pb-6">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-[17px] font-semibold text-[var(--mh-text)]" style="font-family: var(--mh-font-display);">助眠专区</h2>
          <button class="text-[12px] text-[var(--mh-text-light)] flex items-center gap-0.5">
            <span>更多</span>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          </button>
        </div>
        <div class="relative overflow-hidden rounded-2xl h-40" style="background: linear-gradient(135deg, rgba(74,63,56,0.9) 0%, rgba(123,165,196,0.5) 100%);">
          <!-- Decorative stars -->
          <div class="absolute top-4 right-6 w-1.5 h-1.5 rounded-full bg-white/60"></div>
          <div class="absolute top-8 right-14 w-1 h-1 rounded-full bg-white/40"></div>
          <div class="absolute top-5 right-20 w-1.5 h-1.5 rounded-full bg-white/50"></div>
          <div class="absolute top-12 right-8 w-1 h-1 rounded-full bg-white/30"></div>
          <!-- Moon -->
          <div class="absolute top-4 right-4 w-14 h-14">
            <div class="w-full h-full rounded-full bg-gradient-to-br from-[var(--mh-accent-light)] to-[var(--mh-accent)] opacity-80"></div>
          </div>
          <!-- Content -->
          <div class="absolute bottom-0 left-0 right-0 p-5">
            <div class="flex items-center gap-1.5 mb-2">
              <i data-lucide="moon" class="w-4 h-4 text-[var(--mh-accent-light)]"></i>
              <span class="text-[12px] text-white/70 font-medium">深度助眠</span>
            </div>
            <h3 class="text-[18px] font-semibold text-white mb-1" style="font-family: var(--mh-font-display);">星空夜语</h3>
            <div class="flex items-center justify-between">
              <p class="text-[12px] text-white/60">温柔女声 · 45 分钟</p>
              <button class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-sm border border-white/20 flex items-center justify-center text-white transition-transform active:scale-90 hover:bg-white/30">
                <i data-lucide="play" class="w-4 h-4 fill-current ml-0.5"></i>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Bottom Tab Navigation -->
      <nav data-mobile-nav="global" class="fixed bottom-0 left-0 right-0 h-[60px] bg-[var(--mh-card)] border-t border-[var(--mh-border)] z-30 pb-[env(safe-area-inset-bottom)]">
        <div class="w-full max-w-md mx-auto grid grid-cols-5 h-full">
          <button data-dom-id="nav-home" data-nav-key="home" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[11px] text-[var(--mh-text-light)]">
            <i data-lucide="home" class="w-5 h-5 shrink-0"></i>
            <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">首页</span>
          </button>
          <button data-dom-id="nav-mood" data-nav-key="mood" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[11px] text-[var(--mh-text-light)]">
            <i data-lucide="heart" class="w-5 h-5 shrink-0"></i>
            <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">情绪</span>
          </button>
          <button data-dom-id="nav-relax" data-nav-key="relax" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[11px] text-[var(--mh-primary)]">
            <i data-lucide="leaf" class="w-5 h-5 shrink-0 fill-current"></i>
            <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate font-medium">放松</span>
          </button>
          <button data-dom-id="nav-treehole" data-nav-key="treehole" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[11px] text-[var(--mh-text-light)]">
            <i data-lucide="trees" class="w-5 h-5 shrink-0"></i>
            <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">树洞</span>
          </button>
          <button data-dom-id="nav-profile" data-nav-key="profile" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[11px] text-[var(--mh-text-light)]">
            <i data-lucide="user" class="w-5 h-5 shrink-0"></i>
            <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">我的</span>
          </button>
        </div>
      </nav>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
