    <style id="theme-vars">
/* ============================================
   日落花园 · 暖光治愈 — 情绪健康平台主题
   ============================================ */

:root {
  /* Brand prefix: mh (mood health) */
  --mh-primary: #e8834a;
  --mh-primary-foreground: #ffffff;
  --mh-primary-light: #f5c5a3;
  --mh-primary-hover: #d4723a;
  --mh-primary-soft: #fdf0e6;

  --mh-secondary: #8aab7c;
  --mh-secondary-foreground: #ffffff;
  --mh-secondary-light: #b8d0a8;
  --mh-secondary-hover: #7a9b6c;

  --mh-accent: #f0b860;
  --mh-accent-foreground: #4a3f38;
  --mh-accent-light: #f8d898;
  --mh-accent-hover: #e0a848;

  /* Background & Surface */
  --mh-background: #fef8f2;
  --mh-foreground: #4a3f38;
  --mh-warm: #fdf2e8;
  --mh-card: #fffdf9;
  --mh-card-foreground: #4a3f38;
  --mh-popover: #fffdf9;
  --mh-popover-foreground: #4a3f38;
  --mh-surface-muted: #faf5ee;

  /* Text */
  --mh-text: #4a3f38;
  --mh-text-light: #8c8078;
  --mh-text-muted: #b0a69c;
  --mh-muted: #faf5ee;
  --mh-muted-foreground: #8c8078;

  /* Border & Input */
  --mh-border: #e8ddd0;
  --mh-input: #e8ddd0;
  --mh-ring: #e8834a;

  /* Radius */
  --mh-radius-sm: 6px;
  --mh-radius-md: 10px;
  --mh-radius-lg: 16px;
  --mh-radius-xl: 24px;
  --mh-radius-full: 9999px;

  /* Status Colors */
  --mh-success: #7cb89a;
  --mh-success-foreground: #ffffff;
  --mh-warning: #f0b860;
  --mh-warning-foreground: #4a3f38;
  --mh-error: #e0556a;
  --mh-error-foreground: #ffffff;
  --mh-info: #7ba5c4;
  --mh-info-foreground: #ffffff;

  /* Risk Levels */
  --mh-risk-low: #8aab7c;
  --mh-risk-low-soft: rgba(138, 171, 124, 0.12);
  --mh-risk-medium: #d2a35f;
  --mh-risk-medium-soft: rgba(210, 163, 95, 0.12);
  --mh-risk-high: #cf6b7f;
  --mh-risk-high-soft: rgba(207, 107, 127, 0.12);

  /* Mental States */
  --mh-mental-calm: #8aab7c;
  --mh-mental-neutral: #b0a69c;
  --mh-mental-anxious: #c090d0;
  --mh-mental-stressed: #d2a35f;
  --mh-mental-distressed: #cf6b7f;

  /* Mood Colors */
  --mh-mood-happy: #f0b860;
  --mh-mood-sad: #7ba5c4;
  --mh-mood-angry: #e0556a;
  --mh-mood-anxious: #c090d0;
  --mh-mood-calm: #8aab7c;
  --mh-mood-neutral: #b0a69c;

  /* Shadow */
  --mh-shadow-sm: 0 2px 8px rgba(180, 140, 100, 0.08);
  --mh-shadow-md: 0 4px 16px rgba(180, 140, 100, 0.10);
  --mh-shadow-lg: 0 8px 32px rgba(180, 140, 100, 0.14);
  --mh-shadow-glow: 0 0 40px rgba(240, 184, 96, 0.12);

  /* Typography */
  --mh-font-display: 'Noto Serif SC', 'Georgia', 'Songti SC', serif;
  --mh-font-body: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;

  /* Semantic aliases for Tailwind compatibility */
  --background: var(--mh-background);
  --foreground: var(--mh-foreground);
  --card: var(--mh-card);
  --card-foreground: var(--mh-card-foreground);
  --popover: var(--mh-popover);
  --popover-foreground: var(--mh-popover-foreground);
  --primary: var(--mh-primary);
  --primary-foreground: var(--mh-primary-foreground);
  --secondary: var(--mh-secondary);
  --secondary-foreground: var(--mh-secondary-foreground);
  --accent: var(--mh-accent);
  --accent-foreground: var(--mh-accent-foreground);
  --muted: var(--mh-muted);
  --muted-foreground: var(--mh-muted-foreground);
  --destructive: var(--mh-error);
  --destructive-foreground: var(--mh-error-foreground);
  --border: var(--mh-border);
  --input: var(--mh-input);
  --ring: var(--mh-ring);
  --radius: var(--mh-radius-lg);
  --radius-sm: var(--mh-radius-sm);
  --radius-md: var(--mh-radius-md);
  --radius-lg: var(--mh-radius-lg);
  --radius-xl: var(--mh-radius-xl);
  --radius-full: var(--mh-radius-full);
}

/* Dark mode */
@media (prefers-color-scheme: dark) {
  :root {
    --mh-background: #1e1b18;
    --mh-foreground: #e8ddd0;
    --mh-warm: #25211d;
    --mh-card: #2a2520;
    --mh-card-foreground: #e8ddd0;
    --mh-popover: #2a2520;
    --mh-popover-foreground: #e8ddd0;
    --mh-surface-muted: #2f2a24;
    --mh-text: #e8ddd0;
    --mh-text-light: #b0a69c;
    --mh-text-muted: #8c8078;
    --mh-muted: #2f2a24;
    --mh-muted-foreground: #b0a69c;
    --mh-border: #3d3630;
    --mh-input: #3d3630;
    --mh-primary: #f0a070;
    --mh-primary-hover: #f5b890;
    --mh-primary-soft: rgba(240, 160, 112, 0.12);
    --mh-secondary: #a8c898;
    --mh-accent: #f8c878;
    --mh-ring: #f5b890;

    --background: var(--mh-background);
    --foreground: var(--mh-foreground);
    --card: var(--mh-card);
    --card-foreground: var(--mh-card-foreground);
    --popover: var(--mh-popover);
    --popover-foreground: var(--mh-popover-foreground);
    --primary: var(--mh-primary);
    --secondary: var(--mh-secondary);
    --accent: var(--mh-accent);
    --muted: var(--mh-muted);
    --muted-foreground: var(--mh-muted-foreground);
    --destructive: var(--mh-error);
    --border: var(--mh-border);
    --input: var(--mh-input);
    --ring: var(--mh-ring);
  }
}

/* Base styles */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  font-family: var(--mh-font-body);
  background: var(--mh-background);
  color: var(--mh-text);
  line-height: 1.6;
  min-height: 100vh;
}

h1, h2, h3, h4, h5, h6 {
  font-family: var(--mh-font-display);
  font-weight: 600;
  line-height: 1.3;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
}

img {
  max-width: 100%;
  display: block;
}

<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen bg-[var(--mh-background)] pb-[calc(60px+env(safe-area-inset-bottom,16px))]">
      <!-- iOS Status Bar -->
      <div class="flex h-11 items-center justify-between px-6 text-[13px] font-semibold text-[var(--mh-text)]">
        <span class="tabular-nums">9:41</span>
        <div class="flex items-center gap-1">
          <i data-lucide="signal" class="h-3.5 w-3.5"></i>
          <i data-lucide="wifi" class="h-3.5 w-3.5"></i>
          <i data-lucide="battery-full" class="h-4 w-4"></i>
        </div>
      </div>

      <!-- Page Header with decorative background -->
      <div class="relative overflow-hidden">
        <div class="absolute inset-0 opacity-30">
          <img src="../assets/mood-spectrum.jpg" alt="" class="h-full w-full object-cover">
        </div>
        <div class="absolute inset-0 bg-gradient-to-b from-[var(--mh-background)]/40 to-[var(--mh-background)]"></div>
        <div class="relative flex items-center justify-between px-4 pb-4 pt-2">
          <button data-dom-id="back-home" class="flex h-10 w-10 items-center justify-center rounded-full bg-[var(--mh-card)]/80 text-[var(--mh-text)] shadow-sm backdrop-blur-sm transition active:scale-95" aria-label="返回">
            <i data-lucide="chevron-left" class="h-5 w-5"></i>
          </button>
          <h1 class="text-[17px] font-semibold text-[var(--mh-text)]">记录心情</h1>

        </div>
        <p class="mt-1 text-[13px] text-[var(--mh-text-light)]">此刻，你正在经历什么样的情绪？</p>

      <!-- Mood Type Selector -->
      <section class="px-5 pb-5">
        <h2 class="mb-3 text-[15px] font-semibold text-[var(--mh-text)]">选择心情</h2>
        <div class="grid grid-cols-4 gap-3">
          <!-- 开心 - selected -->
          <button class="group flex flex-col items-center gap-1.5" data-mood="happy" aria-pressed="true">
            <div class="flex h-14 w-14 items-center justify-center rounded-full bg-[var(--mh-mood-happy)] text-[28px] shadow-[0_0_20px_rgba(240,184,96,0.4)] ring-2 ring-[var(--mh-mood-happy)] ring-offset-2 ring-offset-[var(--mh-background)] transition-transform active:scale-95">

          <!-- 平静 - selected -->

            <div class="flex h-14 w-14 items-center justify-center rounded-full bg-[var(--mh-mood-calm)] text-[28px] shadow-[0_0_20px_rgba(138,171,124,0.4)] ring-2 ring-[var(--mh-mood-calm)] ring-offset-2 ring-offset-[var(--mh-background)] transition-transform active:scale-95">

            <h2 class="text-[15px] font-semibold text-[var(--mh-text)]">情绪强度</h2>
            <span class="text-[20px] font-semibold text-[var(--mh-primary)]" style="font-family: var(--mh-font-display);">7<span class="text-[13px] text-[var(--mh-text-light)]">/10</span></span>
          </div>
          <div class="relative h-2 w-full rounded-full bg-[var(--mh-muted)]">
            <div class="absolute left-0 top-0 h-full w-[70%] rounded-full bg-gradient-to-r from-[var(--mh-accent)] to-[var(--mh-primary)]"></div>
            <div class="absolute top-1/2 h-5 w-5 -translate-x-1/2 -translate-y-1/2 rounded-full bg-[var(--mh-card)] shadow-md ring-2 ring-[var(--mh-primary)]" style="left: 70%;"></div>
          </div>
          <div class="mt-2 flex justify-between text-[11px] text-[var(--mh-text-muted)]">
            <span>微弱</span>
            <span>适中</span>
            <span>强烈</span>
          </div>
        </div>
      </section>

      <!-- Emotion Tags -->
      <section class="px-5 pb-5">
        <h2 class="mb-3 text-[15px] font-semibold text-[var(--mh-text)]">情绪标签</h2>
        <div class="flex flex-wrap gap-2">
          <button class="h-8 rounded-full bg-[var(--mh-primary-soft)] px-4 text-[13px] text-[var(--mh-primary)] transition active:scale-95">
            愉悦
          </button>
          <button class="h-8 rounded-full bg-[var(--mh-primary-soft)] px-4 text-[13px] text-[var(--mh-primary)] transition active:scale-95">
            满足
          </button>
          <button class="h-8 rounded-full border border-[var(--mh-border)] bg-[var(--mh-card)] px-4 text-[13px] text-[var(--mh-text-light)] transition active:scale-95">
            温暖
          </button>
          <button class="h-8 rounded-full border border-[var(--mh-border)] bg-[var(--mh-card)] px-4 text-[13px] text-[var(--mh-text-light)] transition active:scale-95">
            轻松
          </button>
          <button class="h-8 rounded-full border border-[var(--mh-border)] bg-[var(--mh-card)] px-4 text-[13px] text-[var(--mh-text-light)] transition active:scale-95">
            感动
          </button>
          <button class="h-8 rounded-full border border-[var(--mh-border)] bg-[var(--mh-card)] px-4 text-[13px] text-[var(--mh-text-light)] transition active:scale-95">
            安心
          </button>
          <button class="h-8 rounded-full border border-[var(--mh-border)] bg-[var(--mh-card)] px-4 text-[13px] text-[var(--mh-text-light)] transition active:scale-95">
            充实
          </button>
          <button class="h-8 rounded-full border border-[var(--mh-border)] bg-[var(--mh-card)] px-4 text-[13px] text-[var(--mh-text-light)] transition active:scale-95">
            自由
          </button>
        </div>
      </section>

      <!-- Note Input -->
      <section class="px-5 pb-5">
        <h2 class="mb-3 text-[15px] font-semibold text-[var(--mh-text)]">写下感受</h2>
        <div class="rounded-2xl bg-[var(--mh-card)] p-4 shadow-sm">
          <textarea 
            class="h-28 w-full resize-none bg-transparent text-[14px] leading-relaxed text-[var(--mh-text)] placeholder:text-[var(--mh-text-muted)] focus:outline-none"
            placeholder="今天发生了什么？写下来让心情被看见..."
          ></textarea>
          <div class="flex items-center justify-between border-t border-[var(--mh-border)] pt-3">
            <button class="flex items-center gap-1.5 text-[13px] text-[var(--mh-text-light)] transition active:scale-95">
              <i data-lucide="image" class="h-4 w-4"></i>
              添加图片
            </button>
            <span class="text-[12px] text-[var(--mh-text-muted)]">0/500</span>
          </div>
        </div>
      </section>

      <!-- Trigger Context -->
      <section class="px-5 pb-6">
        <h2 class="mb-3 text-[15px] font-semibold text-[var(--mh-text)]">
          什么触发了这种情绪？
          <span class="text-[12px] font-normal text-[var(--mh-text-muted)]">（可选）</span>
        </h2>
        <div class="flex flex-wrap gap-2">
          <button class="h-9 rounded-xl border border-[var(--mh-border)] bg-[var(--mh-card)] px-4 text-[13px] text-[var(--mh-text-light)] transition active:scale-95">
            工作
          </button>
          <button class="h-9 rounded-xl border border-[var(--mh-border)] bg-[var(--mh-card)] px-4 text-[13px] text-[var(--mh-text-light)] transition active:scale-95">
            学习
          </button>
          <button class="h-9 rounded-xl border border-[var(--mh-border)] bg-[var(--mh-card)] px-4 text-[13px] text-[var(--mh-text-light)] transition active:scale-95">
            人际关系
          </button>
          <button class="h-9 rounded-xl border border-[var(--mh-border)] bg-[var(--mh-card)] px-4 text-[13px] text-[var(--mh-text-light)] transition active:scale-95">
            健康
          </button>
          <button class="h-9 rounded-xl border border-[var(--mh-border)] bg-[var(--mh-card)] px-4 text-[13px] text-[var(--mh-text-light)] transition active:scale-95">
            家庭
          </button>
          <button class="h-9 rounded-xl border border-[var(--mh-border)] bg-[var(--mh-card)] px-4 text-[13px] text-[var(--mh-text-light)] transition active:scale-95">
            其他
          </button>
        </div>
      </section>

      <!-- Bottom Save Button -->
      <div class="fixed bottom-[84px] left-0 right-0 z-20 px-5">
        <button 
          data-dom-id="btn-save-mood"
          class="h-12 w-full rounded-full bg-gradient-to-r from-[var(--mh-accent)] to-[var(--mh-primary)] text-[15px] font-semibold text-[var(--mh-primary-foreground)] shadow-lg shadow-[var(--mh-primary)]/20 transition-all active:scale-[0.98]"
        >
          保存记录
        </button>
      </div>

      <!-- Bottom Tab Navigation -->
      <nav data-mobile-nav="global" class="fixed bottom-0 left-0 right-0 h-[60px] bg-[var(--mh-card)] border-t border-[var(--mh-border)] z-30 pb-[env(safe-area-inset-bottom)]">
        <div class="w-full max-w-md mx-auto grid grid-cols-5 h-full">
          <button data-dom-id="nav-home" data-nav-key="home" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[11px] text-[var(--mh-text-light)]">
            <i data-lucide="home" class="w-5 h-5 shrink-0"></i>
            <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">首页</span>
          </button>
          <button data-dom-id="nav-mood" data-nav-key="mood" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[11px] text-[var(--mh-primary)]">
            <i data-lucide="heart" class="w-5 h-5 shrink-0 fill-current"></i>
            <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate font-medium">情绪</span>
          </button>
          <button data-dom-id="nav-relax" data-nav-key="relax" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[11px] text-[var(--mh-text-light)]">
            <i data-lucide="leaf" class="w-5 h-5 shrink-0"></i>
            <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">放松</span>
          </button>
          <button data-dom-id="nav-treehole" data-nav-key="treehole" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[11px] text-[var(--mh-text-light)]">
            <i data-lucide="trees" class="w-5 h-5 shrink-0"></i>
            <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">树洞</span>
          </button>
          <button data-dom-id="nav-profile" data-nav-key="profile" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[11px] text-[var(--mh-text-light)]">
            <i data-lucide="user" class="w-5 h-5 shrink-0"></i>
            <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">我的</span>
          </button>
        </div>
      </nav>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
