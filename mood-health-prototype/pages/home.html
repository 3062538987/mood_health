    <style id="theme-vars">
/* ============================================
   日落花园 · 暖光治愈 — 情绪健康平台主题
   ============================================ */

:root {
  /* Brand prefix: mh (mood health) */
  --mh-primary: #e8834a;
  --mh-primary-foreground: #ffffff;
  --mh-primary-light: #f5c5a3;
  --mh-primary-hover: #d4723a;
  --mh-primary-soft: #fdf0e6;

  --mh-secondary: #8aab7c;
  --mh-secondary-foreground: #ffffff;
  --mh-secondary-light: #b8d0a8;
  --mh-secondary-hover: #7a9b6c;

  --mh-accent: #f0b860;
  --mh-accent-foreground: #4a3f38;
  --mh-accent-light: #f8d898;
  --mh-accent-hover: #e0a848;

  /* Background & Surface */
  --mh-background: #fef8f2;
  --mh-foreground: #4a3f38;
  --mh-warm: #fdf2e8;
  --mh-card: #fffdf9;
  --mh-card-foreground: #4a3f38;
  --mh-popover: #fffdf9;
  --mh-popover-foreground: #4a3f38;
  --mh-surface-muted: #faf5ee;

  /* Text */
  --mh-text: #4a3f38;
  --mh-text-light: #8c8078;
  --mh-text-muted: #b0a69c;
  --mh-muted: #faf5ee;
  --mh-muted-foreground: #8c8078;

  /* Border & Input */
  --mh-border: #e8ddd0;
  --mh-input: #e8ddd0;
  --mh-ring: #e8834a;

  /* Radius */
  --mh-radius-sm: 6px;
  --mh-radius-md: 10px;
  --mh-radius-lg: 16px;
  --mh-radius-xl: 24px;
  --mh-radius-full: 9999px;

  /* Status Colors */
  --mh-success: #7cb89a;
  --mh-success-foreground: #ffffff;
  --mh-warning: #f0b860;
  --mh-warning-foreground: #4a3f38;
  --mh-error: #e0556a;
  --mh-error-foreground: #ffffff;
  --mh-info: #7ba5c4;
  --mh-info-foreground: #ffffff;

  /* Risk Levels */
  --mh-risk-low: #8aab7c;
  --mh-risk-low-soft: rgba(138, 171, 124, 0.12);
  --mh-risk-medium: #d2a35f;
  --mh-risk-medium-soft: rgba(210, 163, 95, 0.12);
  --mh-risk-high: #cf6b7f;
  --mh-risk-high-soft: rgba(207, 107, 127, 0.12);

  /* Mental States */
  --mh-mental-calm: #8aab7c;
  --mh-mental-neutral: #b0a69c;
  --mh-mental-anxious: #c090d0;
  --mh-mental-stressed: #d2a35f;
  --mh-mental-distressed: #cf6b7f;

  /* Mood Colors */
  --mh-mood-happy: #f0b860;
  --mh-mood-sad: #7ba5c4;
  --mh-mood-angry: #e0556a;
  --mh-mood-anxious: #c090d0;
  --mh-mood-calm: #8aab7c;
  --mh-mood-neutral: #b0a69c;

  /* Shadow */
  --mh-shadow-sm: 0 2px 8px rgba(180, 140, 100, 0.08);
  --mh-shadow-md: 0 4px 16px rgba(180, 140, 100, 0.10);
  --mh-shadow-lg: 0 8px 32px rgba(180, 140, 100, 0.14);
  --mh-shadow-glow: 0 0 40px rgba(240, 184, 96, 0.12);

  /* Typography */
  --mh-font-display: 'Noto Serif SC', 'Georgia', 'Songti SC', serif;
  --mh-font-body: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;

  /* Semantic aliases for Tailwind compatibility */
  --background: var(--mh-background);
  --foreground: var(--mh-foreground);
  --card: var(--mh-card);
  --card-foreground: var(--mh-card-foreground);
  --popover: var(--mh-popover);
  --popover-foreground: var(--mh-popover-foreground);
  --primary: var(--mh-primary);
  --primary-foreground: var(--mh-primary-foreground);
  --secondary: var(--mh-secondary);
  --secondary-foreground: var(--mh-secondary-foreground);
  --accent: var(--mh-accent);
  --accent-foreground: var(--mh-accent-foreground);
  --muted: var(--mh-muted);
  --muted-foreground: var(--mh-muted-foreground);
  --destructive: var(--mh-error);
  --destructive-foreground: var(--mh-error-foreground);
  --border: var(--mh-border);
  --input: var(--mh-input);
  --ring: var(--mh-ring);
  --radius: var(--mh-radius-lg);
  --radius-sm: var(--mh-radius-sm);
  --radius-md: var(--mh-radius-md);
  --radius-lg: var(--mh-radius-lg);
  --radius-xl: var(--mh-radius-xl);
  --radius-full: var(--mh-radius-full);
}

/* Dark mode */
@media (prefers-color-scheme: dark) {
  :root {
    --mh-background: #1e1b18;
    --mh-foreground: #e8ddd0;
    --mh-warm: #25211d;
    --mh-card: #2a2520;
    --mh-card-foreground: #e8ddd0;
    --mh-popover: #2a2520;
    --mh-popover-foreground: #e8ddd0;
    --mh-surface-muted: #2f2a24;
    --mh-text: #e8ddd0;
    --mh-text-light: #b0a69c;
    --mh-text-muted: #8c8078;
    --mh-muted: #2f2a24;
    --mh-muted-foreground: #b0a69c;
    --mh-border: #3d3630;
    --mh-input: #3d3630;
    --mh-primary: #f0a070;
    --mh-primary-hover: #f5b890;
    --mh-primary-soft: rgba(240, 160, 112, 0.12);
    --mh-secondary: #a8c898;
    --mh-accent: #f8c878;
    --mh-ring: #f5b890;

    --background: var(--mh-background);
    --foreground: var(--mh-foreground);
    --card: var(--mh-card);
    --card-foreground: var(--mh-card-foreground);
    --popover: var(--mh-popover);
    --popover-foreground: var(--mh-popover-foreground);
    --primary: var(--mh-primary);
    --secondary: var(--mh-secondary);
    --accent: var(--mh-accent);
    --muted: var(--mh-muted);
    --muted-foreground: var(--mh-muted-foreground);
    --destructive: var(--mh-error);
    --border: var(--mh-border);
    --input: var(--mh-input);
    --ring: var(--mh-ring);
  }
}

/* Base styles */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  font-family: var(--mh-font-body);
  background: var(--mh-background);
  color: var(--mh-text);
  line-height: 1.6;
  min-height: 100vh;
}

h1, h2, h3, h4, h5, h6 {
  font-family: var(--mh-font-display);
  font-weight: 600;
  line-height: 1.3;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
}

img {
  max-width: 100%;
  display: block;
}

              <i data-lucide="flame" class="w-3.5 h-3.5"></i>
              <span>7 天</span>
            </div>
          </div>
          <div class="flex items-end justify-between gap-1.5">
            <div class="flex flex-col items-center gap-1.5">
              <div class="w-7 h-7 rounded-full bg-[var(--mh-mood-happy)] flex items-center justify-center">
                <span class="text-[10px]">😊</span>
              </div>
              <span class="text-[10px] text-[var(--mh-text-muted)]">一</span>
            </div>
            <div class="flex flex-col items-center gap-1.5">
              <div class="w-7 h-7 rounded-full bg-[var(--mh-mood-calm)] flex items-center justify-center">

              </div>
              <span class="text-[10px] text-[var(--mh-text-muted)]">二</span>
            </div>
            <div class="flex flex-col items-center gap-1.5">
              <div class="w-7 h-7 rounded-full bg-[var(--mh-mood-neutral)] flex items-center justify-center">
                <span class="text-[10px]">😐</span>
              </div>
              <span class="text-[10px] text-[var(--mh-text-muted)]">三</span>
            </div>
            <div class="flex flex-col items-center gap-1.5">
              <div class="w-7 h-7 rounded-full bg-[var(--mh-mood-happy)] flex items-center justify-center">
                <span class="text-[10px]">😄</span>
              </div>
              <span class="text-[10px] text-[var(--mh-text-muted)]">四</span>
            </div>
            <div class="flex flex-col items-center gap-1.5">
              <div class="w-7 h-7 rounded-full bg-[var(--mh-mood-sad)] flex items-center justify-center">
                <span class="text-[10px]">😔</span>
              </div>
              <span class="text-[10px] text-[var(--mh-text-muted)]">五</span>
            </div>
            <div class="flex flex-col items-center gap-1.5">
              <div class="w-7 h-7 rounded-full bg-[var(--mh-mood-calm)] flex items-center justify-center">
                <span class="text-[10px]">😌</span>
              </div>
              <span class="text-[10px] text-[var(--mh-text-muted)]">六</span>
            </div>
            <div class="flex flex-col items-center gap-1.5">
              <div class="w-9 h-9 rounded-full bg-[var(--mh-mood-happy)] flex items-center justify-center ring-2 ring-[var(--mh-primary)] ring-offset-2 ring-offset-[var(--mh-card)]">
                <span class="text-sm">🌤️</span>
              </div>
              <span class="text-[10px] text-[var(--mh-primary)] font-medium">今天</span>

        <div data-dom-id="card-ai-insight" class="relative overflow-hidden rounded-[20px] p-5 cursor-pointer transition-transform active:scale-[0.98]" style="background: linear-gradient(135deg, rgba(232, 131, 74, 0.85) 0%, rgba(240, 184, 96, 0.75) 50%, rgba(138, 171, 124, 0.65) 100%);">
          <!-- Decorative elements -->
          <div class="absolute -right-8 -top-8 w-32 h-32 rounded-full bg-white/10 blur-2xl"></div>
          <div class="absolute -left-6 bottom-0 w-24 h-24 rounded-full bg-[var(--mh-accent-light)]/20 blur-xl"></div>
          <div class="absolute right-6 top-4 opacity-40">
            <img src="../assets/ai-companion.jpg" alt="" class="w-16 h-16 rounded-full object-cover" />
          </div>

          <div class="relative z-10">
            <div class="flex items-center gap-2 mb-2">
              <div class="w-7 h-7 rounded-full bg-white/20 backdrop-blur-sm flex items-center justify-center">
                <i data-lucide="sparkles" class="w-4 h-4 text-white"></i>
              </div>
              <span class="text-sm font-medium text-white/90">AI 暖心洞察</span>
            </div>
            <h3 class="text-[17px] font-semibold text-white mb-1.5" style="font-family: var(--mh-font-display);">

            <div class="inline-flex items-center gap-1 text-white/90 text-[12px] font-medium">
              <span>查看完整分析</span>
              <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
            </div>
          </div>
        </div>
      </section>

      <!-- Relax Suggestion Card -->
      <section class="px-5 pb-6">
        <div class="rounded-[20px] bg-[var(--mh-card)] overflow-hidden shadow-[var(--mh-shadow-sm)]">
          <div class="relative h-36 overflow-hidden">
            <img src="../assets/relax-zen-garden.jpg" alt="禅意花园" class="w-full h-full object-cover" />
            <div class="absolute inset-0 bg-gradient-to-t from-[var(--mh-card)] via-transparent to-transparent"></div>
            <div class="absolute bottom-3 left-4">
              <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-white/80 backdrop-blur-sm text-[11px] text-[var(--mh-text)] font-medium">
                <i data-lucide="headphones" class="w-3 h-3"></i>
                冥想音频
              </span>
            </div>
          </div>
          <div class="p-4">
            <div class="flex items-start justify-between gap-3">
              <div class="flex-1 min-w-0">
                <h3 class="text-[15px] font-semibold text-[var(--mh-text)] truncate" style="font-family: var(--mh-font-display);">
                  日落花园 · 5分钟呼吸冥想
                </h3>
                <p class="text-xs text-[var(--mh-text-light)] mt-1 line-clamp-1">

                </p>

              <button class="flex-shrink-0 w-10 h-10 rounded-full bg-[var(--mh-primary)] text-white flex items-center justify-center transition-transform active:scale-95 hover:bg-[var(--mh-primary-hover)]">
                <i data-lucide="play" class="w-4 h-4 ml-0.5"></i>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Bottom Tab Navigation -->
      <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] bg-[var(--mh-card)]/95 backdrop-blur-md border-t border-[var(--mh-border)]/60 z-50">
        <div class="flex items-center justify-around px-2 pt-2 pb-[env(safe-area-inset-bottom,16px)]">
          <button data-dom-id="nav-home" class="flex flex-col items-center gap-0.5 py-1.5 px-3 text-[var(--mh-primary)]">
            <i data-lucide="home" class="w-5 h-5 fill-current"></i>
            <span class="text-[10px] font-medium">首页</span>
          </button>
          <button data-dom-id="nav-mood" class="flex flex-col items-center gap-0.5 py-1.5 px-3 text-[var(--mh-text-muted)] transition-colors hover:text-[var(--mh-text-light)]">
            <i data-lucide="heart" class="w-5 h-5"></i>
            <span class="text-[10px]">情绪</span>
          </button>
          <button data-dom-id="nav-relax" class="flex flex-col items-center gap-0.5 py-1.5 px-3 text-[var(--mh-text-muted)] transition-colors hover:text-[var(--mh-text-light)]">

            <span class="text-[10px]">放松</span>
          </button>
          <button data-dom-id="nav-treehole" class="flex flex-col items-center gap-0.5 py-1.5 px-3 text-[var(--mh-text-muted)] transition-colors hover:text-[var(--mh-text-light)]">
            <i data-lucide="trees" class="w-5 h-5"></i>
            <span class="text-[10px]">树洞</span>
          </button>
          <button data-dom-id="nav-profile" class="flex flex-col items-center gap-0.5 py-1.5 px-3 text-[var(--mh-text-muted)] transition-colors hover:text-[var(--mh-text-light)]">
            <i data-lucide="user" class="w-5 h-5"></i>
            <span class="text-[10px]">我的</span>
          </button>
        </div>
      </nav>

    </main>
