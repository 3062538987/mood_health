    <style id="theme-vars">
/* ============================================
   日落花园 · 暖光治愈 — 情绪健康平台主题
   ============================================ */

:root {
  /* Brand prefix: mh (mood health) */
  --mh-primary: #e8834a;
  --mh-primary-foreground: #ffffff;
  --mh-primary-light: #f5c5a3;
  --mh-primary-hover: #d4723a;
  --mh-primary-soft: #fdf0e6;

  --mh-secondary: #8aab7c;
  --mh-secondary-foreground: #ffffff;
  --mh-secondary-light: #b8d0a8;
  --mh-secondary-hover: #7a9b6c;

  --mh-accent: #f0b860;
  --mh-accent-foreground: #4a3f38;
  --mh-accent-light: #f8d898;
  --mh-accent-hover: #e0a848;

  /* Background & Surface */
  --mh-background: #fef8f2;
  --mh-foreground: #4a3f38;
  --mh-warm: #fdf2e8;
  --mh-card: #fffdf9;
  --mh-card-foreground: #4a3f38;
  --mh-popover: #fffdf9;
  --mh-popover-foreground: #4a3f38;
  --mh-surface-muted: #faf5ee;

  /* Text */
  --mh-text: #4a3f38;
  --mh-text-light: #8c8078;
  --mh-text-muted: #b0a69c;
  --mh-muted: #faf5ee;
  --mh-muted-foreground: #8c8078;

  /* Border & Input */
  --mh-border: #e8ddd0;
  --mh-input: #e8ddd0;
  --mh-ring: #e8834a;

  /* Radius */
  --mh-radius-sm: 6px;
  --mh-radius-md: 10px;
  --mh-radius-lg: 16px;
  --mh-radius-xl: 24px;
  --mh-radius-full: 9999px;

  /* Status Colors */
  --mh-success: #7cb89a;
  --mh-success-foreground: #ffffff;
  --mh-warning: #f0b860;
  --mh-warning-foreground: #4a3f38;
  --mh-error: #e0556a;
  --mh-error-foreground: #ffffff;
  --mh-info: #7ba5c4;
  --mh-info-foreground: #ffffff;

  /* Risk Levels */
  --mh-risk-low: #8aab7c;
  --mh-risk-low-soft: rgba(138, 171, 124, 0.12);
  --mh-risk-medium: #d2a35f;
  --mh-risk-medium-soft: rgba(210, 163, 95, 0.12);
  --mh-risk-high: #cf6b7f;
  --mh-risk-high-soft: rgba(207, 107, 127, 0.12);

  /* Mental States */
  --mh-mental-calm: #8aab7c;
  --mh-mental-neutral: #b0a69c;
  --mh-mental-anxious: #c090d0;
  --mh-mental-stressed: #d2a35f;
  --mh-mental-distressed: #cf6b7f;

  /* Mood Colors */
  --mh-mood-happy: #f0b860;
  --mh-mood-sad: #7ba5c4;
  --mh-mood-angry: #e0556a;
  --mh-mood-anxious: #c090d0;
  --mh-mood-calm: #8aab7c;
  --mh-mood-neutral: #b0a69c;

  /* Shadow */
  --mh-shadow-sm: 0 2px 8px rgba(180, 140, 100, 0.08);
  --mh-shadow-md: 0 4px 16px rgba(180, 140, 100, 0.10);
  --mh-shadow-lg: 0 8px 32px rgba(180, 140, 100, 0.14);
  --mh-shadow-glow: 0 0 40px rgba(240, 184, 96, 0.12);

  /* Typography */
  --mh-font-display: 'Noto Serif SC', 'Georgia', 'Songti SC', serif;
  --mh-font-body: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;

  /* Semantic aliases for Tailwind compatibility */
  --background: var(--mh-background);
  --foreground: var(--mh-foreground);
  --card: var(--mh-card);
  --card-foreground: var(--mh-card-foreground);
  --popover: var(--mh-popover);
  --popover-foreground: var(--mh-popover-foreground);
  --primary: var(--mh-primary);
  --primary-foreground: var(--mh-primary-foreground);
  --secondary: var(--mh-secondary);
  --secondary-foreground: var(--mh-secondary-foreground);
  --accent: var(--mh-accent);
  --accent-foreground: var(--mh-accent-foreground);
  --muted: var(--mh-muted);
  --muted-foreground: var(--mh-muted-foreground);
  --destructive: var(--mh-error);
  --destructive-foreground: var(--mh-error-foreground);
  --border: var(--mh-border);
  --input: var(--mh-input);
  --ring: var(--mh-ring);
  --radius: var(--mh-radius-lg);
  --radius-sm: var(--mh-radius-sm);
  --radius-md: var(--mh-radius-md);
  --radius-lg: var(--mh-radius-lg);
  --radius-xl: var(--mh-radius-xl);
  --radius-full: var(--mh-radius-full);
}

/* Dark mode */
@media (prefers-color-scheme: dark) {
  :root {
    --mh-background: #1e1b18;
    --mh-foreground: #e8ddd0;
    --mh-warm: #25211d;
    --mh-card: #2a2520;
    --mh-card-foreground: #e8ddd0;
    --mh-popover: #2a2520;
    --mh-popover-foreground: #e8ddd0;
    --mh-surface-muted: #2f2a24;
    --mh-text: #e8ddd0;
    --mh-text-light: #b0a69c;
    --mh-text-muted: #8c8078;
    --mh-muted: #2f2a24;
    --mh-muted-foreground: #b0a69c;
    --mh-border: #3d3630;
    --mh-input: #3d3630;
    --mh-primary: #f0a070;
    --mh-primary-hover: #f5b890;
    --mh-primary-soft: rgba(240, 160, 112, 0.12);
    --mh-secondary: #a8c898;
    --mh-accent: #f8c878;
    --mh-ring: #f5b890;

    --background: var(--mh-background);
    --foreground: var(--mh-foreground);
    --card: var(--mh-card);
    --card-foreground: var(--mh-card-foreground);
    --popover: var(--mh-popover);
    --popover-foreground: var(--mh-popover-foreground);
    --primary: var(--mh-primary);
    --secondary: var(--mh-secondary);
    --accent: var(--mh-accent);
    --muted: var(--mh-muted);
    --muted-foreground: var(--mh-muted-foreground);
    --destructive: var(--mh-error);
    --border: var(--mh-border);
    --input: var(--mh-input);
    --ring: var(--mh-ring);
  }
}

/* Base styles */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  font-family: var(--mh-font-body);
  background: var(--mh-background);
  color: var(--mh-text);
  line-height: 1.6;
  min-height: 100vh;
}

h1, h2, h3, h4, h5, h6 {
  font-family: var(--mh-font-display);
  font-weight: 600;
  line-height: 1.3;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
}

img {
  max-width: 100%;
  display: block;
}

          <div class="flex flex-col items-center gap-1.5 flex-shrink-0">
            <div class="w-12 h-12 rounded-full flex items-center justify-center" style="background: linear-gradient(135deg, var(--mh-mood-anxious), var(--mh-primary));">
              <i data-lucide="message-circle-heart" class="w-5 h-5 text-white"></i>
            </div>
            <span class="text-[11px] text-[var(--mh-text-light)] whitespace-nowrap">树洞分享者</span>
          </div>
          <!-- Badge 6 -->
          <div class="flex flex-col items-center gap-1.5 flex-shrink-0">
            <div class="w-12 h-12 rounded-full flex items-center justify-center" style="background: linear-gradient(135deg, var(--mh-accent), var(--mh-secondary));">
              <i data-lucide="book-open" class="w-5 h-5 text-white"></i>
            </div>
            <span class="text-[11px] text-[var(--mh-text-light)] whitespace-nowrap">学习先锋</span>
          </div>
        </div>
      </section>

      <!-- Menu - My Content Group -->
      <section class="px-5 pb-5">
        <h2 class="text-[13px] font-medium text-[var(--mh-text-light)] mb-2 px-1">我的内容</h2>
        <div class="rounded-[16px] bg-[var(--mh-card)] shadow-[var(--mh-shadow-sm)] overflow-hidden">
          <button data-dom-id="menu-mood-archive" class="w-full flex items-center gap-3 px-4 py-3.5 transition-colors active:bg-[var(--mh-muted)] hover:bg-[var(--mh-muted)]/50">
            <div class="w-8 h-8 rounded-lg bg-[var(--mh-primary-soft)] flex items-center justify-center text-[var(--mh-primary)] flex-shrink-0">
              <i data-lucide="folder-heart" class="w-4 h-4"></i>
            </div>
            <span class="flex-1 text-left text-[14px] text-[var(--mh-text)] truncate">情绪档案</span>
            <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--mh-text-muted)] flex-shrink-0"></i>
          </button>
          <div class="h-px bg-[var(--mh-border)]/50 mx-4"></div>
          <button class="w-full flex items-center gap-3 px-4 py-3.5 transition-colors active:bg-[var(--mh-muted)] hover:bg-[var(--mh-muted)]/50">
            <div class="w-8 h-8 rounded-lg bg-[var(--mh-secondary)]/12 flex items-center justify-center text-[var(--mh-secondary)] flex-shrink-0">
              <i data-lucide="stethoscope" class="w-4 h-4"></i>
            </div>
            <span class="flex-1 text-left text-[14px] text-[var(--mh-text)] truncate">咨询记录</span>
            <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--mh-text-muted)] flex-shrink-0"></i>
          </button>
          <div class="h-px bg-[var(--mh-border)]/50 mx-4"></div>
          <button class="w-full flex items-center gap-3 px-4 py-3.5 transition-colors active:bg-[var(--mh-muted)] hover:bg-[var(--mh-muted)]/50">
            <div class="w-8 h-8 rounded-lg bg-[var(--mh-accent)]/15 flex items-center justify-center text-[var(--mh-accent-foreground)] flex-shrink-0">
              <i data-lucide="clipboard-list" class="w-4 h-4"></i>
            </div>
            <span class="flex-1 text-left text-[14px] text-[var(--mh-text)] truncate">测评报告</span>
            <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--mh-text-muted)] flex-shrink-0"></i>
          </button>
          <div class="h-px bg-[var(--mh-border)]/50 mx-4"></div>
          <button class="w-full flex items-center gap-3 px-4 py-3.5 transition-colors active:bg-[var(--mh-muted)] hover:bg-[var(--mh-muted)]/50">
            <div class="w-8 h-8 rounded-lg bg-[var(--mh-primary-soft)] flex items-center justify-center text-[var(--mh-primary)] flex-shrink-0">
              <i data-lucide="bookmark" class="w-4 h-4"></i>
            </div>
            <span class="flex-1 text-left text-[14px] text-[var(--mh-text)] truncate">收藏</span>
            <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--mh-text-muted)] flex-shrink-0"></i>
          </button>
        </div>
      </section>

      <!-- Menu - Settings & Help Group -->
      <section class="px-5 pb-5">
        <h2 class="text-[13px] font-medium text-[var(--mh-text-light)] mb-2 px-1">设置与帮助</h2>
        <div class="rounded-[16px] bg-[var(--mh-card)] shadow-[var(--mh-shadow-sm)] overflow-hidden">
          <button data-dom-id="menu-account" class="w-full flex items-center gap-3 px-4 py-3.5 transition-colors active:bg-[var(--mh-muted)] hover:bg-[var(--mh-muted)]/50">
            <div class="w-8 h-8 rounded-lg bg-[var(--mh-primary-soft)] flex items-center justify-center text-[var(--mh-primary)] flex-shrink-0">
              <i data-lucide="user-circle" class="w-4 h-4"></i>
            </div>
            <span class="flex-1 text-left text-[14px] text-[var(--mh-text)] truncate">账号设置</span>
            <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--mh-text-muted)] flex-shrink-0"></i>
          </button>
          <div class="h-px bg-[var(--mh-border)]/50 mx-4"></div>
          <button class="w-full flex items-center gap-3 px-4 py-3.5 transition-colors active:bg-[var(--mh-muted)] hover:bg-[var(--mh-muted)]/50">
            <div class="w-8 h-8 rounded-lg bg-[var(--mh-secondary)]/12 flex items-center justify-center text-[var(--mh-secondary)] flex-shrink-0">
              <i data-lucide="shield-check" class="w-4 h-4"></i>
            </div>
            <span class="flex-1 text-left text-[14px] text-[var(--mh-text)] truncate">隐私设置</span>
            <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--mh-text-muted)] flex-shrink-0"></i>
          </button>
          <div class="h-px bg-[var(--mh-border)]/50 mx-4"></div>
          <button class="w-full flex items-center gap-3 px-4 py-3.5 transition-colors active:bg-[var(--mh-muted)] hover:bg-[var(--mh-muted)]/50">
            <div class="w-8 h-8 rounded-lg bg-[var(--mh-accent)]/15 flex items-center justify-center text-[var(--mh-accent-foreground)] flex-shrink-0">
              <i data-lucide="bell" class="w-4 h-4"></i>
            </div>
            <span class="flex-1 text-left text-[14px] text-[var(--mh-text)] truncate">通知提醒</span>
            <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--mh-text-muted)] flex-shrink-0"></i>
          </button>
          <div class="h-px bg-[var(--mh-border)]/50 mx-4"></div>
          <button class="w-full flex items-center gap-3 px-4 py-3.5 transition-colors active:bg-[var(--mh-muted)] hover:bg-[var(--mh-muted)]/50">
            <div class="w-8 h-8 rounded-lg bg-[var(--mh-info)]/12 flex items-center justify-center text-[var(--mh-info)] flex-shrink-0">
              <i data-lucide="message-circle-question" class="w-4 h-4"></i>
            </div>
            <span class="flex-1 text-left text-[14px] text-[var(--mh-text)] truncate">帮助与反馈</span>
            <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--mh-text-muted)] flex-shrink-0"></i>
          </button>
          <div class="h-px bg-[var(--mh-border)]/50 mx-4"></div>
          <button class="w-full flex items-center gap-3 px-4 py-3.5 transition-colors active:bg-[var(--mh-muted)] hover:bg-[var(--mh-muted)]/50">
            <div class="w-8 h-8 rounded-lg bg-[var(--mh-text-muted)]/15 flex items-center justify-center text-[var(--mh-text-light)] flex-shrink-0">
              <i data-lucide="info" class="w-4 h-4"></i>
            </div>
            <span class="flex-1 text-left text-[14px] text-[var(--mh-text)] truncate">关于我们</span>
            <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--mh-text-muted)] flex-shrink-0"></i>
          </button>
        </div>
      </section>

      <!-- Safety Reminder -->
      <section class="px-5 pb-6">
        <div class="flex items-center justify-center gap-2 py-3 px-4 rounded-[14px] bg-[var(--mh-secondary)]/8">
          <i data-lucide="lock" class="w-4 h-4 text-[var(--mh-secondary)] flex-shrink-0"></i>
          <span class="text-[12px] text-[var(--mh-text-light)]">你的数据安全加密存储，仅你可见</span>
        </div>
      </section>

      <!-- Bottom Tab Navigation -->
      <nav data-mobile-nav="global" class="fixed bottom-0 left-0 right-0 h-[60px] bg-[var(--mh-card)] border-t border-[var(--mh-border)] z-30 pb-[env(safe-area-inset-bottom)]">
        <div class="w-full max-w-md mx-auto grid grid-cols-5 h-full">
          <button data-dom-id="nav-home" data-nav-key="home" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[11px] text-[var(--mh-text-light)]">
            <i data-lucide="home" class="w-5 h-5 shrink-0"></i>
            <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">首页</span>
          </button>
          <button data-dom-id="nav-mood" data-nav-key="mood" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[11px] text-[var(--mh-text-light)]">
            <i data-lucide="heart" class="w-5 h-5 shrink-0"></i>
            <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">情绪</span>
          </button>
          <button data-dom-id="nav-relax" data-nav-key="relax" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[11px] text-[var(--mh-text-light)]">
            <i data-lucide="leaf" class="w-5 h-5 shrink-0"></i>
            <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">放松</span>
          </button>
          <button data-dom-id="nav-treehole" data-nav-key="treehole" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[11px] text-[var(--mh-text-light)]">
            <i data-lucide="trees" class="w-5 h-5 shrink-0"></i>
            <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">树洞</span>
          </button>
          <button data-dom-id="nav-profile" data-nav-key="profile" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[11px] text-[var(--mh-primary)]">
            <i data-lucide="user" class="w-5 h-5 shrink-0 fill-current"></i>
            <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate font-medium">我的</span>
          </button>
        </div>
      </nav>

    </main>
    <script>lucide.createIcons();</script>
</body>
